# cargo-deny policy: supply-chain gate run in CI (`cargo deny check`).

[graph]
all-features = false
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "aarch64-unknown-linux-gnu" }]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Transitive unmaintained crates (rustls-pemfile via axum-server)
# are tracked in README "Limitations"; only direct dependencies fail the build.
unmaintained = "workspace"
ignore = [
  # rsa (Marvin timing attack): in the enabled graph through jsonwebtoken's rust_crypto backend, used
  # only to verify RS256/RS384/RS512 OIDC provider tokens (public inputs). Aurix issues HS256 only.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5 timing variability: p256/p384 via jsonwebtoken rust_crypto, used only to verify
  # ES256/ES384 OIDC tokens; the fix needs elliptic-curve 0.14, which jsonwebtoken does not support yet.
  "RUSTSEC-2026-0387",
]

[licenses]
version = 2
# Workspace crates are `publish = false`; their own licences (AGPL-3.0-only for the server,
# Apache-2.0 for the client core) are mapped in REUSE.toml and are not third-party policy.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # No OpenSSL anywhere: TLS is rustls (API/WS/reqwest/sqlx), WebRTC DTLS is aws-lc-rs.
    { crate = "openssl", reason = "rustls / aws-lc-rs only" },
    { crate = "openssl-sys", reason = "rustls / aws-lc-rs only" },
    { crate = "native-tls", reason = "rustls only" },
    { crate = "git2", reason = "no VCS access at runtime" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
