# No hostNetwork: UDP media/cascade and the 443 strict-firewall paths via hostPort, TURN disabled,
# node IPs listed per ordinal.
replicaCount: 2
hostNetwork: false
existingSecret: aurix-secrets
ports:
  tlsTunnel: 443
  webtransport: 443
config:
  externalUrl: https://voice.example.com
  corsOrigins: [https://game.example.com]
  externalIpSource: static
  externalIps: [203.0.113.10, 203.0.113.11]
  turn:
    enabled: false
persistence:
  enabled: true
  size: 50Gi
