apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurix.headlessServiceName" . }}
  labels:
    {{- include "aurix.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "aurix.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.ports.api }}
      targetPort: api
    - name: ws
      port: {{ .Values.ports.ws }}
      targetPort: ws
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurix.fullname" . }}
  labels:
    {{- include "aurix.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aurix.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.ports.api }}
      targetPort: api
      protocol: TCP
    - name: ws
      port: {{ .Values.ports.ws }}
      targetPort: ws
      protocol: TCP
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.perNode.enabled }}
{{- $root := . }}
{{- range $i := until (int .Values.replicaCount) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurix.fullname" $root }}-{{ $i }}
  labels:
    {{- include "aurix.labels" $root | nindent 4 }}
    aurix.io/node-ordinal: {{ $i | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "aurix.selectorLabels" $root | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "aurix.fullname" $root }}-{{ $i }}
  ports:
    - name: api
      port: {{ $root.Values.ports.api }}
      targetPort: api
      protocol: TCP
    - name: ws
      port: {{ $root.Values.ports.ws }}
      targetPort: ws
      protocol: TCP
{{- end }}
{{- end }}
