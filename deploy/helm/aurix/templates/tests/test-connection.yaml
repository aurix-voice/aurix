apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aurix.fullname" . }}-test-connection
  labels:
    {{- include "aurix.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "aurix.image" . }}
      command: ["curl", "-fsS", "http://{{ include "aurix.fullname" . }}:{{ .Values.ports.api }}/ready"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
