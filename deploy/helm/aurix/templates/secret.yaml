{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurix.secretName" . }}
  labels:
    {{- include "aurix.labels" . | nindent 4 }}
type: Opaque
stringData:
  AURIX__DATABASE__URL: {{ required "secrets.databaseUrl (or existingSecret) is required" .Values.secrets.databaseUrl | quote }}
  AURIX__REDIS__URL: {{ required "secrets.redisUrl (or existingSecret) is required" .Values.secrets.redisUrl | quote }}
  AURIX__AUTH__JWT_SECRET: {{ required "secrets.jwtSecret (or existingSecret) is required" .Values.secrets.jwtSecret | quote }}
  {{- with .Values.secrets.turnAuthSecret }}
  AURIX__TURN__AUTH_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.cascadeSecret }}
  AURIX__MEDIA__CASCADE_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminBootstrapToken }}
  AURIX__AUTH__ADMIN_BOOTSTRAP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.recordingEncryptionKey }}
  AURIX__RECORDING__ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3AccessKey }}
  AURIX__RECORDING__S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretKey }}
  AURIX__RECORDING__S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
