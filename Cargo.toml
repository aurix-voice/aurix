[workspace]
resolver = "2"
members = [
    "crates/aurix-common",
    "crates/aurix-db",
    "crates/aurix-auth",
    "crates/aurix-media",
    "crates/aurix-turn",
    "crates/aurix-control",
    "crates/aurix-api",
    "crates/aurix-ws",
    "crates/aurix-moderation",
    "crates/aurix-recording",
    "crates/aurix-metrics",
    "crates/aurix-server",
    "crates/aurix-cli",
    "crates/aurix-loadtest",
    "crates/aurix-soak",
    "crates/aurix-client",
    "crates/aurix-opus",
    "examples/rooms/bot",
]
# libFuzzer harnesses live in their own workspace (cargo-fuzz layout); `fuzz/tests/corpus.rs`
# replays the committed corpus on stable.
exclude = ["fuzz"]

[workspace.package]
rust-version = "1.88"
version = "1.13.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/aurix-voice/aurix"
authors = ["Aurix Contributors"]
publish = false

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "11.1"
argon2 = "0.6"
rand = "0.10"
ring = "0.17"
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
aes-gcm = "0.11"
aes = "0.9"
ctr = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls", "tls-roots"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "rt-tokio"] }
prometheus = { version = "0.14", default-features = false, features = ["process"] }
redis = { version = "1.8", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "sentinel", "cluster-async"] }
dashmap = "6.2"
parking_lot = "0.13"
bytes = "1.5"
thiserror = "2.0"
anyhow = "1.0"
config = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2"] }
url = "2.5"
regex = "1.10"
aho-corasick = "1.1"
unicode-normalization = "0.1"
ipnetwork = "0.21"
crc32fast = "1.4"
crossbeam-channel = "0.5"
flume = "0.12"
arc-swap = "1.7"
maxminddb = "0.32"
flate2 = "1.0"
governor = "0.6"
pin-project-lite = "0.2"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.29"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1"
sha1 = "0.11"
subtle = "2.6"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
md-5 = "0.11"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
opus = { package = "aurix-opus", path = "crates/aurix-opus" }
hex = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn"] }
time = { version = "0.3", default-features = false, features = ["std"] }
