[workspace]
resolver = "2"
members = [
    "crates/aurix-common",
    "crates/aurix-db",
    "crates/aurix-auth",
    "crates/aurix-media",
    "crates/aurix-turn",
    "crates/aurix-control",
    "crates/aurix-api",
    "crates/aurix-ws",
    "crates/aurix-moderation",
    "crates/aurix-recording",
    "crates/aurix-metrics",
    "crates/aurix-server",
    "crates/aurix-cli",
    "crates/aurix-loadtest",
    "crates/aurix-client",
]

[workspace.package]
rust-version = "1.88"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aurix-voice/aurix"
authors = ["Aurix Contributors"]
publish = false

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.2"
argon2 = "0.5"
rand = "0.8"
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes = "0.8"
ctr = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.31"
opentelemetry = { version = "0.30", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "grpc-tonic", "tls", "tls-roots"] }
opentelemetry_sdk = { version = "0.30", features = ["trace", "metrics", "rt-tokio"] }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
dashmap = "5.5"
parking_lot = "0.12"
bytes = "1.5"
thiserror = "1.0"
anyhow = "1.0"
config = "0.14"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2"] }
url = "2.5"
regex = "1.10"
aho-corasick = "1.1"
unicode-normalization = "0.1"
ipnetwork = "0.20"
crc32fast = "1.4"
crossbeam-channel = "0.5"
flume = "0.11"
arc-swap = "1.7"
governor = "0.6"
pin-project-lite = "0.2"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.24"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
sha1 = "0.10"
subtle = "2.6"
md-5 = "0.10"
libc = "0.2"
str0m = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
opus = "0.3"
hex = "0.4"