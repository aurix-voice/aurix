[package]
name = "aurix-rooms-bot"
description = "Aurix Rooms demo bot: a native aurix-client session that plays music, speech, ambience and test signals into a room and keeps the Rooms backend's now-playing card current"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aurix-rooms-bot"
path = "src/main.rs"

[dependencies]
aurix-client = { path = "../../../crates/aurix-client" }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
