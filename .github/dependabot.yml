  - package-ecosystem: "nuget"
    directory: "/sdk/server/csharp/Aurix.Server.Tests"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      nuget-deps: { patterns: ["*"] }
  - package-ecosystem: "nuget"
    directory: "/sdk/server/examples/token-server/csharp/TokenServer"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      nuget-deps: { patterns: ["*"] }
  - package-ecosystem: "nuget"
    directory: "/sdk/unity/DotNet~/Aurix.Voice"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      nuget-deps: { patterns: ["*"] }
  - package-ecosystem: "nuget"
    directory: "/sdk/unity/DotNet~/Aurix.Voice.Tests"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      nuget-deps: { patterns: ["*"] }
