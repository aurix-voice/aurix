name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake libopus-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake libopus-dev
      - run: cargo test --workspace --locked

  e2e:
    name: live E2E (Postgres + Redis + server)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurix
          POSTGRES_PASSWORD: aurix
          POSTGRES_DB: aurix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurix" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake libopus-dev
      - run: cargo build --locked --bin aurix-server --bin aurix
      - name: Run server
        env:
          AURIX__TURN__ENABLED: "true"
          AURIX__TURN__AUTH_SECRET: ci-only-turn-secret-0123456789abcdefghijklmno
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__RECORDING__ENABLED: "true"
          AURIX__RECORDING__STORAGE_PATH: ${{ runner.temp }}/recordings
          AURIX__SERVER__SESSION_RESUME_GRACE_SECS: "4"
          AURIX__CHAT__PERSIST: "true"
          AURIX__MEDIA__MAX_CHANNELS_PER_SESSION: "4"
          AURIX__AUTH__ADMIN_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-0123456789
          AURIX__TRACING__LOG_FORMAT: text
        run: |
          nohup ./target/debug/aurix-server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ready
      - name: Bootstrap admin, app and API key
        id: bootstrap
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:8080/admin/setup -H 'content-type: application/json' \
            -H 'x-bootstrap-token: ci-only-bootstrap-token-0123456789' \
            -d '{"email":"ci@example.com","password":"ci-admin-password-0123456789","display_name":"CI"}'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/admin/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-admin-password-0123456789"}' | jq -r .token)
          KEY=$(curl -fsS -X POST http://127.0.0.1:8080/v1/apps -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"name":"ci"}' | jq -r .api_key)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          KEY2=$(curl -fsS -X POST http://127.0.0.1:8080/v1/apps -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"name":"ci-tenant2"}' | jq -r .api_key)
          echo "::add-mask::$KEY2"
          echo "key2=$KEY2" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"
          echo "admin_token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: E2E
        env:
          AURIX_E2E_API: http://127.0.0.1:8080
          AURIX_E2E_WS: ws://127.0.0.1:8081
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
          AURIX_E2E_API_KEY2: ${{ steps.bootstrap.outputs.key2 }}
          AURIX_E2E_ADMIN_TOKEN: ${{ steps.bootstrap.outputs.admin_token }}
          AURIX_E2E_MAX_CHANNELS: "4"
        run: cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture
      - name: E2E (native client core)
        env:
          AURIX_E2E_API: http://127.0.0.1:8080
          AURIX_E2E_WS: ws://127.0.0.1:8081
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: cargo test --locked -p aurix-client --test e2e_live -- --nocapture
      - name: E2E (strict action tokens)
        env:
          AURIX__TURN__ENABLED: "false"
          AURIX__RECORDING__ENABLED: "false"
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__AUTH__REQUIRE_ACTION_TOKENS: "true"
          AURIX__SERVER__API_PORT: "8090"
          AURIX__SERVER__WS_PORT: "8091"
          AURIX__MEDIA__PORT: "10002"
          AURIX__METRICS__PORT: "9091"
          AURIX__TRACING__LOG_FORMAT: text
          AURIX_E2E_STRICT: "1"
          AURIX_E2E_API: http://127.0.0.1:8090
          AURIX_E2E_WS: ws://127.0.0.1:8091
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: |
          nohup ./target/debug/aurix-server > server-strict.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8090/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/ready
          cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture strict_mode
      - name: E2E (speech + content safety against the mock provider)
        env:
          AURIX__TURN__ENABLED: "false"
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__RECORDING__ENABLED: "true"
          AURIX__RECORDING__STORAGE_PATH: ${{ runner.temp }}/recordings-speech
          AURIX__SERVER__API_PORT: "8100"
          AURIX__SERVER__WS_PORT: "8101"
          AURIX__MEDIA__PORT: "10003"
          AURIX__METRICS__PORT: "9092"
          AURIX__STT__ENABLED: "true"
          AURIX__STT__ENDPOINT: http://127.0.0.1:18790
          AURIX__STT__API_KEY: ci-only-speech-token
          AURIX__STT__SEGMENT_SECS: "1.5"
          AURIX__STT__INCLUDE_WORDS: "true"
          AURIX__TTS__ENABLED: "true"
          AURIX__TTS__ENDPOINT: http://127.0.0.1:18790
          AURIX__TTS__API_KEY: ci-only-speech-token
          AURIX__TTS__VOICES: alloy,nova
          AURIX__TTS__MAX_AUDIO_SECS: "4"
          AURIX__TTS__REQUESTS_PER_MINUTE_PER_SESSION: "6"
          AURIX__TTS__MAX_QUEUED_PER_SESSION: "2"
          AURIX__SAFETY__ENABLED: "true"
          AURIX__SAFETY__CLASSIFIER__ENDPOINT: http://127.0.0.1:18790/v1/moderations
          AURIX__SAFETY__CLASSIFIER__API_KEY: ci-only-speech-token
          AURIX__SAFETY__TEXT__LEXICON_PATH: configs/lexicon.example.toml
          AURIX__SAFETY__TEXT__AUTO_MUTE: elevated
          AURIX__SAFETY__VOICE__AUTO_KICK: high
          AURIX__TRACING__LOG_FORMAT: text
          AURIX_E2E_SAFETY: "1"
          AURIX_E2E_API: http://127.0.0.1:8100
          AURIX_E2E_WS: ws://127.0.0.1:8101
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
          AURIX_E2E_API_KEY2: ${{ steps.bootstrap.outputs.key2 }}
        run: |
          cargo build --locked -p aurix-server --example mock_speech
          nohup ./target/debug/examples/mock_speech 127.0.0.1:18790 ci-only-speech-token > mock-speech.log 2>&1 &
          nohup ./target/debug/aurix-server > server-speech.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8100/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8100/ready
          cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture speech_transcripts content_safety
      - if: failure()
        run: |
          tail -n 200 server.log
          tail -n 100 server-strict.log || true
          tail -n 200 server-speech.log || true
          tail -n 50 mock-speech.log || true

  audit:
    name: cargo audit / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  sdks:
    name: Web + Unity SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - run: npm ci
        working-directory: sdk/web
      - run: npm run check && npm test
        working-directory: sdk/web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Aurix.sln -v q --nologo
        working-directory: sdk/unity/DotNet

  docs:
    name: OpenAPI + mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @redocly/cli@1 lint api/openapi.json --skip-rule no-unused-components
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - run: mdbook build docs
      - run: test -f docs/book/api/openapi.json && test -f docs/book/index.html

  deploy:
    name: Helm chart + Terraform example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Helm lint + template (every ci/ values file)
        working-directory: deploy/helm/aurix
        run: |
          set -e
          for values in ci/*.yaml; do
            helm lint . --strict -f "$values"
            helm template aurix . -f "$values" > /dev/null
          done
      - name: kubeconform (rendered manifests)
        working-directory: deploy/helm/aurix
        run: |
          set -e
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for values in ci/*.yaml; do
            helm template aurix . -f "$values" \
              | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0
          done
      - name: Terraform fmt + validate
        working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  docker:
    name: docker build + healthcheck
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aurix-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and reports its version
        run: |
          docker run --rm --entrypoint id aurix-server:ci | grep -q 'uid=10001'
          docker run --rm --entrypoint /usr/local/bin/aurix aurix-server:ci --help
