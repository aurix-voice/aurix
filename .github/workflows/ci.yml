name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
      - run: cargo test --workspace --locked

  e2e:
    name: live E2E (Postgres + Redis + server)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurix
          POSTGRES_PASSWORD: aurix
          POSTGRES_DB: aurix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurix" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
      - run: cargo build --locked --bin aurix-server --bin aurix
      - name: Run server
        env:
          AURIX__TURN__ENABLED: "true"
          AURIX__TURN__AUTH_SECRET: ci-only-turn-secret-0123456789abcdefghijklmno
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__RECORDING__ENABLED: "true"
          AURIX__RECORDING__STORAGE_PATH: ${{ runner.temp }}/recordings
          AURIX__SERVER__SESSION_RESUME_GRACE_SECS: "4"
          AURIX__CHAT__PERSIST: "true"
          AURIX__MEDIA__MAX_CHANNELS_PER_SESSION: "4"
          AURIX__QUALITY__PERSIST_INTERVAL_SECS: "10"
          AURIX__RATE_LIMITING__ENABLED: "true"
          AURIX__RATE_LIMITING__REQUESTS_PER_SECOND: "500"
          AURIX__RATE_LIMITING__BURST_SIZE: "1000"
          AURIX__RATE_LIMITING__REPORTS_PER_MINUTE: "3"
          AURIX__AUTH__ADMIN_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-0123456789
          AURIX__TRACING__LOG_FORMAT: text
        run: |
          nohup ./target/debug/aurix-server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ready
      - name: Bootstrap admin, app and API key
        id: bootstrap
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:8080/admin/setup -H 'content-type: application/json' \
            -H 'x-bootstrap-token: ci-only-bootstrap-token-0123456789' \
            -d '{"email":"ci@example.com","password":"ci-admin-password-0123456789","display_name":"CI"}'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/admin/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-admin-password-0123456789"}' | jq -r .token)
          KEY=$(curl -fsS -X POST http://127.0.0.1:8080/v1/apps -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"name":"ci"}' | jq -r .api_key)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          KEY2=$(curl -fsS -X POST http://127.0.0.1:8080/v1/apps -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"name":"ci-tenant2"}' | jq -r .api_key)
          echo "::add-mask::$KEY2"
          echo "key2=$KEY2" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"
          echo "admin_token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: E2E
        env:
          AURIX_E2E_API: http://127.0.0.1:8080
          AURIX_E2E_WS: ws://127.0.0.1:8081
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
          AURIX_E2E_API_KEY2: ${{ steps.bootstrap.outputs.key2 }}
          AURIX_E2E_ADMIN_TOKEN: ${{ steps.bootstrap.outputs.admin_token }}
          AURIX_E2E_MAX_CHANNELS: "4"
          AURIX_E2E_REPORTS_PER_MINUTE: "3"
        run: cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture
      - name: PostgreSQL integration (chat history, usage aggregation)
        env:
          AURIX_E2E_DATABASE_URL: postgres://aurix:aurix@127.0.0.1:5432/aurix
        run: cargo test --locked -p aurix-db -- --ignored --nocapture
      - name: E2E (native client core)
        env:
          AURIX_E2E_API: http://127.0.0.1:8080
          AURIX_E2E_WS: ws://127.0.0.1:8081
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: cargo test --locked -p aurix-client --test e2e_live -- --nocapture
      - name: E2E (strict action tokens)
        env:
          AURIX__TURN__ENABLED: "false"
          AURIX__RECORDING__ENABLED: "false"
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__AUTH__REQUIRE_ACTION_TOKENS: "true"
          AURIX__SERVER__API_PORT: "8090"
          AURIX__SERVER__WS_PORT: "8091"
          AURIX__MEDIA__PORT: "10002"
          AURIX__METRICS__PORT: "9091"
          AURIX__QUALITY__PERSIST_INTERVAL_SECS: "10"
          AURIX__TRACING__LOG_FORMAT: text
          AURIX_E2E_STRICT: "1"
          AURIX_E2E_API: http://127.0.0.1:8090
          AURIX_E2E_WS: ws://127.0.0.1:8091
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: |
          nohup ./target/debug/aurix-server > server-strict.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8090/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/ready
          cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture strict_mode
      - name: E2E (dual-stack media and TURN on ::)
        env:
          AURIX__TURN__ENABLED: "true"
          AURIX__TURN__AUTH_SECRET: ci-only-turn-secret-0123456789abcdefghijklmno
          AURIX__TURN__HOST: "::"
          AURIX__TURN__UDP_PORT: "3479"
          AURIX__TURN__TCP_PORT: "3479"
          AURIX__TURN__MIN_PORT: "41000"
          AURIX__TURN__MAX_PORT: "41100"
          AURIX__RECORDING__ENABLED: "false"
          AURIX__MEDIA__HOST: "::"
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__MEDIA__EXTERNAL_IPV6: "::1"
          AURIX__SERVER__API_PORT: "8070"
          AURIX__SERVER__WS_PORT: "8071"
          AURIX__MEDIA__PORT: "10006"
          AURIX__METRICS__PORT: "9096"
          AURIX__TRACING__LOG_FORMAT: text
          AURIX_E2E_IPV6: "1"
          AURIX_E2E_API: http://127.0.0.1:8070
          AURIX_E2E_WS: ws://127.0.0.1:8071
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: |
          nohup ./target/debug/aurix-server > server-dual-stack.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8070/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8070/ready
          cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture dual_stack_node
      - name: E2E (speech, content safety and recording post-processing against the mock provider)
        env:
          AURIX__TURN__ENABLED: "false"
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__RECORDING__ENABLED: "true"
          AURIX__RECORDING__STORAGE_PATH: ${{ runner.temp }}/recordings-speech
          AURIX__SERVER__API_PORT: "8100"
          AURIX__SERVER__WS_PORT: "8101"
          AURIX__MEDIA__PORT: "10003"
          AURIX__METRICS__PORT: "9092"
          AURIX__STT__ENABLED: "true"
          AURIX__STT__ENDPOINT: http://127.0.0.1:18790
          AURIX__STT__API_KEY: ci-only-speech-token
          AURIX__STT__SEGMENT_SECS: "1.5"
          AURIX__STT__INCLUDE_WORDS: "true"
          AURIX__TTS__ENABLED: "true"
          AURIX__TTS__ENDPOINT: http://127.0.0.1:18790
          AURIX__TTS__API_KEY: ci-only-speech-token
          AURIX__TTS__VOICES: alloy,nova
          AURIX__TTS__MAX_AUDIO_SECS: "4"
          AURIX__TTS__REQUESTS_PER_MINUTE_PER_SESSION: "6"
          AURIX__TTS__MAX_QUEUED_PER_SESSION: "2"
          AURIX__TRANSLATION__ENABLED: "true"
          AURIX__TRANSLATION__ENDPOINT: http://127.0.0.1:18790
          AURIX__TRANSLATION__API_KEY: ci-only-speech-token
          AURIX__TRANSLATION__TIMEOUT_MS: "1500"
          AURIX__TRANSLATION__LANGUAGES: en,de,fr,it,nl
          AURIX__SAFETY__ENABLED: "true"
          AURIX__SAFETY__CLASSIFIER__ENDPOINT: http://127.0.0.1:18790/v1/moderations
          AURIX__SAFETY__CLASSIFIER__API_KEY: ci-only-speech-token
          AURIX__SAFETY__TEXT__LEXICON_PATH: configs/lexicon.example.toml
          AURIX__SAFETY__TEXT__AUTO_MUTE: elevated
          AURIX__SAFETY__VOICE__AUTO_KICK: high
          AURIX__TRACING__LOG_FORMAT: text
          AURIX_E2E_SAFETY: "1"
          AURIX_E2E_API: http://127.0.0.1:8100
          AURIX_E2E_WS: ws://127.0.0.1:8101
          AURIX_E2E_METRICS: http://127.0.0.1:9092/metrics
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
          AURIX_E2E_API_KEY2: ${{ steps.bootstrap.outputs.key2 }}
        run: |
          cargo build --locked -p aurix-server --example mock_speech
          nohup ./target/debug/examples/mock_speech 127.0.0.1:18790 ci-only-speech-token > mock-speech.log 2>&1 &
          nohup ./target/debug/aurix-server > server-speech.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8100/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8100/ready
          cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture speech_transcripts content_safety recording_mixdown live_translation
      - name: E2E (admin SSO against the mock OIDC provider + administrator lifecycle)
        env:
          AURIX__TURN__ENABLED: "false"
          AURIX__RECORDING__ENABLED: "false"
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          AURIX__MEDIA__CASCADE_DISCOVERY: "false"
          AURIX__SERVER__API_PORT: "8110"
          AURIX__SERVER__WS_PORT: "8111"
          AURIX__MEDIA__PORT: "10007"
          AURIX__METRICS__PORT: "9097"
          AURIX__AUTH__OIDC__ENABLED: "true"
          AURIX__AUTH__OIDC__ISSUER: http://127.0.0.1:18791
          AURIX__AUTH__OIDC__CLIENT_ID: aurix-admin
          AURIX__AUTH__OIDC__CLIENT_SECRET: ci-only-oidc-secret
          AURIX__AUTH__OIDC__REDIRECT_URL: http://127.0.0.1:8110/admin/oidc/callback
          AURIX__AUTH__OIDC__ALLOW_INSECURE: "true"
          AURIX__AUTH__OIDC__ROLE_MAPPING__AURIX_ADMINS: admin
          AURIX__AUTH__OIDC__ROLE_MAPPING__AURIX_OPS: moderator
          AURIX__AUTH__OIDC__SUPERADMIN_EMAILS: root.sso@example.com
          AURIX__AUTH__OIDC__ALLOWED_DOMAINS: example.com
          AURIX__TRACING__LOG_FORMAT: text
          AURIX_E2E_OIDC: "1"
          AURIX_E2E_API: http://127.0.0.1:8110
          AURIX_E2E_WS: ws://127.0.0.1:8111
          AURIX_E2E_API_KEY: ${{ steps.bootstrap.outputs.key }}
          AURIX_E2E_ADMIN_TOKEN: ${{ steps.bootstrap.outputs.admin_token }}
        run: |
          cargo build --locked -p aurix-server --example mock_oidc
          nohup ./target/debug/examples/mock_oidc 127.0.0.1:18791 aurix-admin ci-only-oidc-secret > mock-oidc.log 2>&1 &
          nohup ./target/debug/aurix-server > server-oidc.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8110/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8110/ready
          cargo test --locked -p aurix-server --test e2e_live -- --ignored --nocapture admin_sso
      - if: failure()
        run: |
          tail -n 200 server.log
          tail -n 100 server-strict.log || true
          tail -n 200 server-speech.log || true
          tail -n 50 mock-speech.log || true
          tail -n 200 server-oidc.log || true
          tail -n 50 mock-oidc.log || true

  audit:
    name: cargo audit / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  native-core:
    name: native core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Win64
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            platform: Mac
          - name: macOS x64
            os: macos-13
            target: x86_64-apple-darwin
            platform: Mac
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Unit tests, the cbindgen header-drift check and the C / C++ samples (compiled with the
      # host's gcc/clang against the freshly built cdylib). libopus 1.6 is built from the sources
      # bundled with opusic-sys (cmake ships with the runner images).
      - run: cargo test --locked -p aurix-client
      - name: Stage the Unreal / Unity native library (${{ matrix.platform }})
        if: runner.os != 'Windows'
        run: sdk/unreal/scripts/build_native.sh --target ${{ matrix.target }}
      - name: Stage the Unreal / Unity native library (${{ matrix.platform }})
        if: runner.os == 'Windows'
        run: .\sdk\unreal\scripts\build_native.ps1 -Target ${{ matrix.target }}
      - name: Library exports the C ABI
        shell: bash
        run: |
          set -euo pipefail
          lib=sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary/lib/${{ matrix.platform }}
          ls -la "$lib"
          if [ "${{ runner.os }}" = macOS ]; then
            nm -gU "$lib/libaurix_client.dylib" | grep -q ' _aurix_version$'
          else
            # MSVC emits the import library next to the DLL only when symbols are exported.
            test -s "$lib/aurix_client.dll.lib"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aurix-client-${{ matrix.target }}
          path: |
            sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary/lib/${{ matrix.platform }}
            sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary/include
          if-no-files-found: error

  sdks:
    name: Web + Unity SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - run: npm ci
        working-directory: sdk/web
      - run: npm run check && npm test
        working-directory: sdk/web
      - name: Unity WebGL plugin (.jslib) against the real Web SDK bundle (Node, Emscripten stand-in — not a Unity player build)
        run: node --test test/unity-jslib.test.mjs
        working-directory: sdk/web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Aurix.sln -v q --nologo
        working-directory: sdk/unity/DotNet~
      - name: Unity compile check (WebGL player, WebGL editor, Android defines)
        run: |
          dotnet build Aurix.Voice.UnityCheck --no-incremental -v q --nologo -p:UnityExtraDefines=UNITY_WEBGL
          dotnet build Aurix.Voice.UnityCheck --no-incremental -v q --nologo "-p:UnityExtraDefines=UNITY_WEBGL%3BUNITY_EDITOR"
          dotnet build Aurix.Voice.UnityCheck --no-incremental -v q --nologo -p:UnityExtraDefines=UNITY_ANDROID
        working-directory: sdk/unity/DotNet~

  server-sdks:
    name: Server SDKs (Node/Python/Go/C#) + token servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated clients match api/openapi.json
        run: python3 tools/openapi-sdk/generate.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sdk/server/node/package-lock.json
            sdk/server/examples/token-server/node/package-lock.json
      - name: Node SDK
        run: npm ci && npm run check && npm test
        working-directory: sdk/server/node
      - name: Node token server
        run: npm ci && npm test
        working-directory: sdk/server/examples/token-server/node
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "pytest>=8" "mypy>=1.10" "ruff>=0.6"
      - name: Python SDK
        run: python3 -m mypy aurix_server tests && python3 -m pytest -q && python3 -m ruff check .
        working-directory: sdk/server/python
      - name: Python token server
        run: python3 -m pytest -q && PYTHONPATH=../../../python python3 -m mypy . && python3 -m ruff check .
        working-directory: sdk/server/examples/token-server/python
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false   # stdlib-only modules, no go.sum
      - name: Go SDK
        run: test -z "$(gofmt -l .)" && go vet ./... && go test -count=1 ./...
        working-directory: sdk/server/go
      - name: Go token server
        run: test -z "$(gofmt -l .)" && go vet ./... && go test -count=1 ./...
        working-directory: sdk/server/examples/token-server/go
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: C# SDK
        run: dotnet test Aurix.Server.sln -c Release -v q --nologo
        working-directory: sdk/server/csharp
      - name: C# token server
        run: dotnet test TokenServer.sln -c Release -v q --nologo
        working-directory: sdk/server/examples/token-server/csharp
      # the aurix CLI (crates/aurix-cli, embedded contract + integration tests) is covered by `lint` and `test`

  godot:
    name: Godot GDExtension (build + headless smoke)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config cmake scons
      - name: Check out godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: godot-${{ env.GODOT_VERSION }}
          path: sdk/godot/godot-cpp
      - uses: actions/cache@v4
        with:
          path: |
            sdk/godot/godot-cpp/bin
            sdk/godot/godot-cpp/gen
            sdk/godot/godot-cpp/src/**/*.os
          key: godot-cpp-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ hashFiles('sdk/godot/SConstruct') }}
      - name: Build aurix-client, stage it and build the extension
        run: sdk/godot/scripts/build_native.sh
      - name: Install the Godot ${{ env.GODOT_VERSION }} headless editor
        run: |
          set -euo pipefail
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project, parse the demo script, run the API smoke test
        run: |
          set -euo pipefail
          # First import registers the extension; scripts referencing its classes only compile
          # on the second pass, which must be clean.
          "$GODOT" --headless --path sdk/godot --import >/dev/null 2>&1 || true
          "$GODOT" --headless --path sdk/godot --import 2>&1 | tee import.log
          ! grep -q "ERROR" import.log
          "$GODOT" --headless --path sdk/godot --check-only -s demo/main.gd 2>&1 | tee check.log
          ! grep -q "SCRIPT ERROR" check.log
          timeout 120 "$GODOT" --headless --path sdk/godot -s tests/smoke.gd
          timeout 120 "$GODOT" --headless --path sdk/godot -s tests/web_smoke.gd

  godot-web:
    name: Godot Web export + Unity WebGL bridge (Chromium, live node)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      GODOT_VERSION: 4.3-stable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurix
          POSTGRES_PASSWORD: aurix
          POSTGRES_DB: aurix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurix" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --quiet "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium
      - name: Install the Godot ${{ env.GODOT_VERSION }} editor and Web export templates
        run: |
          set -euo pipefail
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          # The .tpz is a zip; only the Web templates are extracted (the preset disables threads).
          curl -sSfL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$DEST"
          unzip -q -j templates.tpz 'templates/version.txt' 'templates/web_nothreads_*.zip' 'templates/web_release.zip' 'templates/web_debug.zip' -d "$DEST"
          rm -f templates.tpz godot.zip
      - name: Build the Web SDK bundle and export the Godot lobby
        run: |
          set -euo pipefail
          (cd sdk/web && npm ci && npm run build)
          sdk/godot/scripts/build_web.sh 2>&1 | tee export.log
          # The desktop .gdextension has no web.wasm32 slice by design; any other ERROR fails the job.
          ! grep "ERROR" export.log | grep -v "No suitable library found for GDExtension" | grep -q .
      - run: cargo build --locked --bin aurix-server
      - name: Run server
        env:
          AURIX__MEDIA__EXTERNAL_IP: 127.0.0.1
          # Chromium never gathers loopback host candidates, so browser media reaches a 127.0.0.1 node only via TURN.
          AURIX__TURN__ENABLED: "true"
          AURIX__TURN__AUTH_SECRET: ci-only-turn-secret-0123456789abcdefghijklmno
          # The exported lobby is served from an ephemeral 127.0.0.1 port (not production mode).
          AURIX__SERVER__CORS_ORIGINS: "*"
          AURIX__AUTH__ADMIN_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-0123456789
          AURIX__TRACING__LOG_FORMAT: text
        run: |
          nohup ./target/debug/aurix-server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ready
      - name: Bootstrap admin, app and API key
        id: bootstrap
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:8080/admin/setup -H 'content-type: application/json' \
            -H 'x-bootstrap-token: ci-only-bootstrap-token-0123456789' \
            -d '{"email":"ci@example.com","password":"ci-admin-password-0123456789","display_name":"CI"}'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/admin/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-admin-password-0123456789"}' | jq -r .token)
          KEY=$(curl -fsS -X POST http://127.0.0.1:8080/v1/apps -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"name":"godot-web"}' | jq -r .api_key)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Godot Web lobby in Chromium (boot, SDK glue, live join/chat/speaking/quality)
        env:
          AURIX_API_URL: http://127.0.0.1:8080
          AURIX_WS_URL: ws://127.0.0.1:8081/ws
          AURIX_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: python sdk/godot/tests/web/godot_web_e2e.py
      - name: Unity WebGL template + AurixWebGL.jslib in Chromium (Emscripten stand-in, live join/chat/speaking/quality — not a Unity player build)
        env:
          AURIX_API_URL: http://127.0.0.1:8080
          AURIX_WS_URL: ws://127.0.0.1:8081/ws
          AURIX_API_KEY: ${{ steps.bootstrap.outputs.key }}
        run: python sdk/unity/BrowserTests~/webgl_bridge_e2e.py
      - name: Server log
        if: failure()
        run: tail -n 200 server.log

  unreal:
    name: Unreal plugin (static checks; BuildPlugin only with UE container access)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      # Epic's Linux development image; pulling it requires a GitHub account linked to an Epic
      # Games account (https://github.com/EpicGames/UnrealEngine access) and a PAT with
      # read:packages stored as UE_GHCR_TOKEN (+ UE_GHCR_USER). Override the tag with the
      # UE_CONTAINER_IMAGE repository variable.
      UE_IMAGE: ${{ vars.UE_CONTAINER_IMAGE || 'ghcr.io/epicgames/unreal-engine:dev-slim-5.3.2' }}
      HAS_UE_ACCESS: ${{ secrets.UE_GHCR_TOKEN != '' && secrets.UE_GHCR_USER != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Plugin descriptor, packaging files, UHT conventions, module dependency direction
        run: python3 sdk/unreal/scripts/check_plugin.py
      - if: env.HAS_UE_ACCESS == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: env.HAS_UE_ACCESS == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: unreal
      - name: Stage the native library for Linux
        if: env.HAS_UE_ACCESS == 'true'
        run: sdk/unreal/scripts/build_native.sh --target x86_64-unknown-linux-gnu
      - name: Log in to GHCR with the Epic-linked account
        if: env.HAS_UE_ACCESS == 'true'
        run: echo "${{ secrets.UE_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.UE_GHCR_USER }}" --password-stdin
      - name: RunUAT BuildPlugin (Linux, -Rocket -StrictIncludes) inside ${{ env.UE_IMAGE }}
        if: env.HAS_UE_ACCESS == 'true'
        run: |
          set -euo pipefail
          mkdir -p out/AurixVoice && chmod 777 out/AurixVoice
          docker run --rm \
            -v "$PWD/sdk/unreal/AurixVoice:/plugin" \
            -v "$PWD/out/AurixVoice:/package" \
            "$UE_IMAGE" \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildPlugin \
              -Plugin=/plugin/AurixVoice.uplugin -Package=/package \
              -TargetPlatforms=Linux -Rocket -StrictIncludes
          test -f out/AurixVoice/AurixVoice.uplugin
          ls out/AurixVoice/Binaries/Linux
      - uses: actions/upload-artifact@v4
        if: env.HAS_UE_ACCESS == 'true'
        with:
          name: unreal-plugin-linux
          path: out/AurixVoice
          if-no-files-found: error
      - name: Engine build skipped
        if: env.HAS_UE_ACCESS != 'true'
        run: |
          echo "::notice title=Unreal BuildPlugin not run::UE_GHCR_TOKEN/UE_GHCR_USER are not set; only the engine-free checks ran. The plugin has NOT been compiled by Unreal Engine in this CI run."

  docs:
    name: OpenAPI + mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @redocly/cli@1 lint api/openapi.json --skip-rule no-unused-components
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - run: mdbook build docs
      - run: test -f docs/book/api/openapi.json && test -f docs/book/index.html

  deploy:
    name: Helm chart + Terraform example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Helm lint + template (every ci/ values file)
        working-directory: deploy/helm/aurix
        run: |
          set -e
          for values in ci/*.yaml; do
            helm lint . --strict -f "$values"
            helm template aurix . -f "$values" > /dev/null
          done
      - name: kubeconform (rendered manifests)
        working-directory: deploy/helm/aurix
        run: |
          set -e
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for values in ci/*.yaml; do
            helm template aurix . -f "$values" \
              | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0
          done
      - name: Terraform fmt + validate
        working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  docker:
    name: docker build + healthcheck
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aurix-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and reports its version
        run: |
          docker run --rm --entrypoint id aurix-server:ci | grep -q 'uid=10001'
          docker run --rm --entrypoint /usr/local/bin/aurix aurix-server:ci --help
