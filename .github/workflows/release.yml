# Tag-driven release. `git tag v1.3.0 && git push origin v1.3.0` produces a GitHub release with:
#   * server bundles (aurix-server + aurix CLI + configs + migrations) for Linux x86_64 / aarch64
#   * aurix CLI and the native client core (libaurix_client + C/C++ headers) for
#     Linux x86_64 / aarch64, Windows x64, macOS arm64 / x86_64
#   * SDK packages: Web (npm tgz), Unity UPM (tgz), Unreal plugin (zip, with native libs),
#     Godot addon (zip, source), server SDKs for Node (tgz) / Python (sdist + wheel) / C# (nupkg)
#   * SHA256SUMS, a CycloneDX SBOM of the source tree and of the container image
#   * ghcr.io/<owner>/aurix-server:<version>, :<major>.<minor>, :<major> (+ :latest for stable)
#   * Sigstore keyless signatures (cosign) for SHA256SUMS and the image, GitHub build-provenance
#     attestations for every file — both use the workflow's OIDC identity, no stored key.
#
# Nothing is published to npm / PyPI / NuGet / pkg.go.dev: packages are attached to the release
# and consumed from there (or via git URL). Docs: docs/src/operations/releases.md.
#
# `workflow_dispatch` runs everything in dry-run mode: builds and checks, uploads workflow
# artifacts, but neither pushes images nor creates a release.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dry-run (defaults to the workspace version)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/aurix-server
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/aurix-dashboard

jobs:
  verify:
    name: version + changelog + policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${{ inputs.version }}"
            [ -n "$version" ] || version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
            publish=false
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $version (prerelease=$prerelease publish=$publish)"
      - name: Every artifact carries this version and CHANGELOG has its section
        run: python3 tools/release/check_versions.py "${{ steps.meta.outputs.version }}"
      - name: Release notes render
        run: python3 tools/release/changelog_section.py "${{ steps.meta.outputs.version }}" > /dev/null
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  server:
    name: server bundle (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang
      - run: cargo build --release --locked --bin aurix-server --bin aurix --bin aurix-loadtest
      - name: Stage
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="aurix-server-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$name/bin"
          cp target/release/aurix-server target/release/aurix target/release/aurix-loadtest "dist/$name/bin/"
          cp -r configs migrations "dist/$name/"
          cp README.md LICENSE LICENSING.md CHANGELOG.md SECURITY.md "dist/$name/"
          "dist/$name/bin/aurix" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-server-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  native:
    name: CLI + native core (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: Linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            platform: Linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: Win64
          - target: aarch64-apple-darwin
            os: macos-14
            platform: Mac
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: Mac
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang
      - name: Native core (Unix)
        if: runner.os != 'Windows'
        run: sdk/unreal/scripts/build_native.sh --target ${{ matrix.target }}
      - name: Native core (Windows)
        if: runner.os == 'Windows'
        run: .\sdk\unreal\scripts\build_native.ps1 -Target ${{ matrix.target }}
      - name: CLI
        run: cargo build --release --locked --bin aurix --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tp=sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary
          core="aurix-client-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$core"
          cp -r "$tp/include" "dist/$core/include"
          cp -r "$tp/lib/${{ matrix.platform }}" "dist/$core/lib"
          cp crates/aurix-client/LICENSE NOTICE "dist/$core/"
          cli="aurix-cli-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$cli"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/aurix.exe" "dist/$cli/"
            cp LICENSE "dist/$cli/"
            (cd dist && 7z a -bd "$core.zip" "$core" > /dev/null && 7z a -bd "$cli.zip" "$cli" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/aurix" "dist/$cli/"
            cp LICENSE "dist/$cli/"
            (cd dist && tar -czf "$core.tar.gz" "$core" && tar -czf "$cli.tar.gz" "$cli")
          fi
          rm -rf "dist/$core" "dist/$cli"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
      # Raw staged libraries for the Unreal plugin assembly below.
      - uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.target }}
          path: sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary/lib/${{ matrix.platform }}
          if-no-files-found: error

  native-mobile:
    name: native core (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - if: matrix.name == 'android'
        env:
          ANDROID_NDK_PIN: 27.2.12479018
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config cmake clang
          # Pin the NDK: the runner's "latest" (r30) is newer than cargo-ndk understands.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_PIN}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_PIN}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_PIN}" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build (Android, three ABIs)
        if: matrix.name == 'android'
        run: |
          set -euo pipefail
          for t in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            sdk/unreal/scripts/build_native.sh --target "$t"
          done
      - name: Stage
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tp=sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary
          core="aurix-client-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$core"
          cp -r "$tp/include" "dist/$core/include"
          cp -r "$tp/lib/Android" "dist/$core/lib"
          cp crates/aurix-client/LICENSE NOTICE "dist/$core/"
          (cd dist && tar -czf "$core.tar.gz" "$core")
          rm -rf "dist/$core"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.name }}
          path: sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary/lib/Android
          if-no-files-found: error

  sdks:
    name: SDK packages
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: mkdir -p dist
      - name: Web SDK
        working-directory: sdk/web
        run: |
          npm ci
          npm run build
          npm pack --pack-destination ../../dist
      - name: Unity UPM tarball
        working-directory: sdk/unity
        run: npm pack --pack-destination ../../dist
      - name: Godot addon (source only; the prebuilt addon is produced by the godot-addon job)
        run: |
          (cd sdk/godot/addons && zip -qr "../../../dist/aurix-godot-addon-${VERSION}-source.zip" aurix_voice -x 'aurix_voice/bin/*')
      - name: Node server SDK
        working-directory: sdk/server/node
        run: |
          npm ci
          npm run build
          npm pack --pack-destination ../../../dist
      - name: Python server SDK
        working-directory: sdk/server/python
        run: |
          python -m pip install --quiet build
          python -m build --outdir ../../../dist
      - name: C# server SDK
        run: dotnet pack sdk/server/csharp/Aurix.Server/Aurix.Server.csproj -c Release -o dist -p:PackageVersion=${VERSION}
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdks
          path: dist/
          if-no-files-found: error

  unreal-plugin:
    name: Unreal plugin zip (Win64 + Mac universal + Linux + Android)
    needs: [verify, native, native-mobile]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-lib-*
          path: libs
      - name: Assemble ThirdParty libraries
        run: |
          set -euo pipefail
          tp=sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary
          mkdir -p "$tp/lib/Win64" "$tp/lib/Mac" "$tp/lib/Linux" "$tp/include"
          cp libs/native-lib-x86_64-pc-windows-msvc/* "$tp/lib/Win64/"
          cp libs/native-lib-x86_64-unknown-linux-gnu/libaurix_client.so "$tp/lib/Linux/"
          lipo -create \
            libs/native-lib-aarch64-apple-darwin/libaurix_client.dylib \
            libs/native-lib-x86_64-apple-darwin/libaurix_client.dylib \
            -output "$tp/lib/Mac/libaurix_client.dylib"
          lipo -info "$tp/lib/Mac/libaurix_client.dylib"
          mkdir -p "$tp/lib/Android"
          cp -R libs/native-lib-android/. "$tp/lib/Android/"
          find "$tp/lib" -type f | sort
          cp crates/aurix-client/include/aurix_client.h crates/aurix-client/include/aurix_client.hpp "$tp/include/"
          python3 sdk/unreal/scripts/check_plugin.py
      - name: Zip
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd sdk/unreal && zip -qr "../../dist/AurixVoice-unreal-${VERSION}.zip" AurixVoice -x '*/Binaries/*' '*/Intermediate/*')
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-unreal
          path: dist/*.zip
          if-no-files-found: error

  unreal-fab:
    # Engine-compiled plugin (what Fab / an installed-engine project consumes). Needs the Epic-linked
    # GHCR account for the UE container; without it the job records a notice and produces nothing.
    name: Unreal BuildPlugin (Linux, -Rocket) → Fab package
    needs: [verify, native, native-mobile]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      UE_IMAGE: ${{ vars.UE_CONTAINER_IMAGE || 'ghcr.io/epicgames/unreal-engine:dev-slim-5.3.2' }}
      HAS_UE_ACCESS: ${{ secrets.UE_GHCR_TOKEN != '' && secrets.UE_GHCR_USER != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_UE_ACCESS == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-lib-*
          path: libs
      - name: Stage ThirdParty (Linux + Android; the container compiles Linux)
        if: env.HAS_UE_ACCESS == 'true'
        run: |
          set -euo pipefail
          tp=sdk/unreal/AurixVoice/Source/ThirdParty/AurixClientLibrary
          mkdir -p "$tp/lib/Linux" "$tp/lib/Android" "$tp/include"
          cp libs/native-lib-x86_64-unknown-linux-gnu/libaurix_client.so "$tp/lib/Linux/"
          cp -R libs/native-lib-android/. "$tp/lib/Android/"
          cp crates/aurix-client/include/aurix_client.h crates/aurix-client/include/aurix_client.hpp "$tp/include/"
      - if: env.HAS_UE_ACCESS == 'true'
        run: echo "${{ secrets.UE_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.UE_GHCR_USER }}" --password-stdin
      - name: RunUAT BuildPlugin
        if: env.HAS_UE_ACCESS == 'true'
        run: |
          set -euo pipefail
          mkdir -p out/AurixVoice && chmod 777 out/AurixVoice
          docker run --rm \
            -v "$PWD/sdk/unreal/AurixVoice:/plugin" \
            -v "$PWD/out/AurixVoice:/package" \
            "$UE_IMAGE" \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildPlugin \
              -Plugin=/plugin/AurixVoice.uplugin -Package=/package \
              -TargetPlatforms=Linux -Rocket -StrictIncludes
          test -f out/AurixVoice/AurixVoice.uplugin
          mkdir -p dist
          (cd out && zip -qr "../dist/AurixVoice-unreal-${VERSION}-packaged-Linux.zip" AurixVoice -x '*/Intermediate/*')
          ls -la dist
      - uses: actions/upload-artifact@v4
        if: env.HAS_UE_ACCESS == 'true'
        with:
          name: dist-unreal-fab
          path: dist/*.zip
          if-no-files-found: error
      - if: env.HAS_UE_ACCESS != 'true'
        run: echo "::notice title=Unreal BuildPlugin skipped::UE_GHCR_TOKEN/UE_GHCR_USER are not set; the release ships the source plugin zip only (compiled by the consumer's engine)."

  godot-bin:
    name: Godot GDExtension (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    env:
      GODOT_VERSION: 4.3-stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux.x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux.arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows.x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos.universal
            os: macos-14
            target: aarch64-apple-darwin
          - name: android.arm64
            os: ubuntu-22.04
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.name == 'macos.universal' && ',x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-godot-${{ matrix.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet scons
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config cmake clang
      - if: matrix.name == 'android.arm64'
        env:
          ANDROID_NDK_PIN: 27.2.12479018
          GODOT_CPP_NDK: 23.2.8568313
        run: |
          # Pin the NDK: the runner's "latest" (r30) is newer than cargo-ndk understands; godot-cpp 4.3's
          # SCons tooling hardcodes r23 for the extension itself.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_PIN}" "ndk;${GODOT_CPP_NDK}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_PIN}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_PIN}" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Check out godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: godot-${{ env.GODOT_VERSION }}
          path: sdk/godot/godot-cpp
      - uses: actions/cache@v4
        with:
          path: |
            sdk/godot/godot-cpp/bin
            sdk/godot/godot-cpp/gen
            sdk/godot/godot-cpp/src/**/*.os
            sdk/godot/godot-cpp/src/**/*.obj
          key: godot-cpp-release-${{ env.GODOT_VERSION }}-${{ matrix.name }}-${{ hashFiles('sdk/godot/SConstruct') }}
      - name: macOS universal Rust core (both slices, lipo)
        if: matrix.name == 'macos.universal'
        run: |
          set -euo pipefail
          cargo build --release --locked -p aurix-client --lib --target aarch64-apple-darwin
          cargo build --release --locked -p aurix-client --lib --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/libaurix_client.dylib target/x86_64-apple-darwin/release/libaurix_client.dylib \
            -output target/universal-apple-darwin/release/libaurix_client.dylib
          install_name_tool -id @loader_path/libaurix_client.dylib target/universal-apple-darwin/release/libaurix_client.dylib
      - name: Build Rust core, stage, build the extension (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = macos.universal ]; then
            # build_native.sh builds one slice; swap in the universal dylib before scons.
            sdk/godot/scripts/build_native.sh --release --target aarch64-apple-darwin --no-extension
            cp -f target/universal-apple-darwin/release/libaurix_client.dylib sdk/godot/addons/aurix_voice/bin/macos.universal/libaurix_client.dylib
            (cd sdk/godot && scons platform=macos target=template_release -j"$(sysctl -n hw.ncpu)")
            (cd sdk/godot && scons platform=macos target=template_debug -j"$(sysctl -n hw.ncpu)")
          else
            sdk/godot/scripts/build_native.sh --release --target ${{ matrix.target }}
            sdk/godot/scripts/build_native.sh --target ${{ matrix.target }}
          fi
          ls -R sdk/godot/addons/aurix_voice/bin
      - name: Build Rust core, stage, build the extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked -p aurix-client --lib --target x86_64-pc-windows-msvc
          $dest = "sdk/godot/addons/aurix_voice/bin/windows.x86_64"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/aurix_client.dll, target/x86_64-pc-windows-msvc/release/aurix_client.dll.lib $dest
          Push-Location sdk/godot
          scons platform=windows arch=x86_64 target=template_release
          scons platform=windows arch=x86_64 target=template_debug
          Pop-Location
          Get-ChildItem -Recurse sdk/godot/addons/aurix_voice/bin
      - uses: actions/upload-artifact@v4
        with:
          name: godot-bin-${{ matrix.name }}
          path: sdk/godot/addons/aurix_voice/bin/${{ matrix.name }}
          if-no-files-found: error

  godot-addon:
    name: Godot addon zip (all platforms)
    needs: [verify, godot-bin]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-bin-*
          path: bins
      - name: Assemble
        run: |
          set -euo pipefail
          rm -rf sdk/godot/addons/aurix_voice/bin
          mkdir -p sdk/godot/addons/aurix_voice/bin
          for d in bins/godot-bin-*; do
            name="${d#bins/godot-bin-}"
            mkdir -p "sdk/godot/addons/aurix_voice/bin/$name"
            cp -R "$d/." "sdk/godot/addons/aurix_voice/bin/$name/"
          done
          find sdk/godot/addons/aurix_voice/bin -maxdepth 2 | sort
          mkdir -p dist
          (cd sdk/godot/addons && zip -qry "../../../dist/aurix-godot-addon-${VERSION}.zip" aurix_voice)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-godot
          path: dist/*.zip
          if-no-files-found: error

  image:
    name: container image (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            os: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            os: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.verify.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each architecture compiles on a runner of that architecture (a Rust release build under
      # QEMU takes hours); the per-arch images are pushed by digest and merged into one tagged
      # manifest list by `image-manifest`.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=aurix-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.slug }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.verify.outputs.publish == 'true' }}
      - name: Export digest
        if: needs.verify.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: needs.verify.outputs.publish == 'true'
        with:
          name: image-digest-${{ matrix.slug }}
          path: digests/*
          if-no-files-found: error

  image-manifest:
    name: container image manifest, SBOM, signature
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.publish == 'true'
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
        if: needs.verify.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: needs.verify.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        if: needs.verify.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Release-derived tags only; `latest` follows stable releases, never pre-releases.
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=v${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - name: Create the multi-arch manifest list
        if: needs.verify.outputs.publish == 'true'
        working-directory: digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: digest
        if: needs.verify.outputs.publish == 'true'
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ -n "$digest" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
      - name: Image SBOM (CycloneDX)
        if: needs.verify.outputs.publish == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          output-file: aurix-server-${{ needs.verify.outputs.version }}.image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign image and attest SBOM (Sigstore keyless)
        if: needs.verify.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3
      - if: needs.verify.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "aurix-server-${{ needs.verify.outputs.version }}.image.cdx.json" "${IMAGE}@${DIGEST}"
      - uses: actions/upload-artifact@v4
        if: needs.verify.outputs.publish == 'true'
        with:
          name: dist-image-sbom
          path: "*.image.cdx.json"
          if-no-files-found: error

  dashboard-image:
    name: dashboard image (Caddy, multi-arch), SBOM, signature
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.verify.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=v${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      # The SPA is compiled once on the build platform; only the Caddy runtime stage is per-arch,
      # so a single multi-platform build is cheap enough here (unlike the Rust server image).
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=aurix-dashboard
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-dashboard
          cache-to: type=gha,mode=max,scope=release-dashboard
          provenance: mode=max
          sbom: true
      - name: Image SBOM (CycloneDX)
        if: needs.verify.outputs.publish == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DASHBOARD_IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: aurix-dashboard-${{ needs.verify.outputs.version }}.image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3
        if: needs.verify.outputs.publish == 'true'
      - name: Sign image and attest SBOM (Sigstore keyless)
        if: needs.verify.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DASHBOARD_IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "aurix-dashboard-${{ needs.verify.outputs.version }}.image.cdx.json" "${DASHBOARD_IMAGE}@${DIGEST}"
      - uses: actions/upload-artifact@v4
        if: needs.verify.outputs.publish == 'true'
        with:
          name: dist-dashboard-image-sbom
          path: "*.image.cdx.json"
          if-no-files-found: error

  publish:
    name: checksums, SBOM, signatures, GitHub release
    needs: [verify, server, native, native-mobile, sdks, unreal-plugin, unreal-fab, godot-addon, image-manifest, dashboard-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Generated before the built artifacts are downloaded so the scan sees the source tree only.
      - name: Source SBOM (CycloneDX; Cargo.lock, package-lock.json, pyproject, go.mod, csproj)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: aurix-${{ needs.verify.outputs.version }}.source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: staged
          merge-multiple: true
      - run: mv "aurix-${VERSION}.source.cdx.json" staged/
      - uses: actions/setup-node@v4
        if: needs.verify.outputs.publish == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @aurix/web-sdk to npm (OIDC trusted publishing, provenance; no token)
        if: needs.verify.outputs.publish == 'true'
        run: |
          set -euo pipefail
          npm install -g npm@latest >/dev/null   # trusted publishing needs npm >= 11.5.1
          npm --version
          tag=latest; case "$VERSION" in *-*) tag=next ;; esac
          if npm publish "./staged/aurix-web-sdk-${VERSION}.tgz" --access public --provenance --tag "$tag"; then
            echo "::notice title=npm::@aurix/web-sdk@${VERSION} published (dist-tag ${tag})"
          else
            echo "::warning title=npm publish failed::Configure the trusted publisher on npmjs.com for @aurix/web-sdk (GitHub Actions: aurix-voice / aurix / release.yml, no environment). The tarball is attached to the GitHub release regardless."
          fi
      - name: Unity package branch for OpenUPM (upm = sdk/unity subtree, tag upm/v<version>)
        if: needs.verify.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --unshallow 2>/dev/null || true
          sha=$(git subtree split --prefix sdk/unity HEAD)
          git push --force origin "$sha:refs/heads/upm"
          git tag -f "upm/v${VERSION}" "$sha"
          git push --force origin "refs/tags/upm/v${VERSION}"
          echo "::notice title=Unity::upm branch + tag upm/v${VERSION} pushed; OpenUPM picks it up once com.aurix.voice is registered (gitTagPrefix upm/v)."
      - name: SHA256SUMS
        working-directory: staged
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
        if: needs.verify.outputs.publish == 'true'
      - name: Sign SHA256SUMS (Sigstore keyless, certificate bound to this workflow run)
        if: needs.verify.outputs.publish == 'true'
        working-directory: staged
        run: |
          cosign sign-blob --yes SHA256SUMS \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.sigstore.json
      - name: Build-provenance attestations for every file
        if: needs.verify.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            staged/*
            !staged/SHA256SUMS.sig
            !staged/SHA256SUMS.pem
            !staged/SHA256SUMS.sigstore.json
      - name: Release notes
        run: |
          {
            python3 tools/release/changelog_section.py "$VERSION"
            echo
            echo "## Verify"
            echo
            echo '```sh'
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "cosign verify ${IMAGE}@${{ needs.image-manifest.outputs.digest }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "cosign verify ${DASHBOARD_IMAGE}@${{ needs.dashboard-image.outputs.digest }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Images: \`${IMAGE}:${VERSION}\` (digest \`${{ needs.image-manifest.outputs.digest }}\`), \`${DASHBOARD_IMAGE}:${VERSION}\` (digest \`${{ needs.dashboard-image.outputs.digest }}\`)."
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: |
            staged/
            notes.md
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: needs.verify.outputs.publish == 'true'
        with:
          name: Aurix ${{ needs.verify.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: staged/*
      # Go resolves a module living in a subdirectory from tags prefixed with that path.
      - name: Tag the Go server SDK module
        if: needs.verify.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="sdk/server/go/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"; exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          # GITHUB_TOKEN may not create refs for commits that touch .github/workflows (needs the
          # `workflows` permission GitHub does not grant to Actions); then the releaser pushes it.
          git push origin "refs/tags/$tag" || echo "::warning title=Go module tag::could not push $tag from Actions; run: git tag $tag $GITHUB_SHA && git push origin refs/tags/$tag"
