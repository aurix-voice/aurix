<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurix Web SDK demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; }
  label { display: block; margin: .4rem 0; }
  input { width: 100%; box-sizing: border-box; padding: .35rem; font: inherit; }
  button { padding: .45rem .9rem; margin: .2rem .2rem .2rem 0; font: inherit; }
  #roster li { list-style: none; padding: .3rem .5rem; border-radius: 6px; margin: .2rem 0; background: #8881; }
  #roster li.speaking { background: #2c82; }
  #roster li.muted { opacity: .6; }
  #log { height: 12rem; overflow: auto; font: 12px/1.35 ui-monospace, monospace; background: #0001; padding: .5rem; white-space: pre-wrap; }
  #chat { height: 10rem; overflow: auto; background: #0001; padding: .5rem; }
  #chat div { margin: .15rem 0; }
  #chat .own { opacity: .75; }
  #chat .system { font-style: italic; }
  #chat .direct { color: #c70; }
  #chat .failed { text-decoration: line-through; color: #c33; }
  #typing { min-height: 1.2em; font-size: .85em; opacity: .7; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .status { font-weight: 600; }
  details summary { cursor: pointer; }
</style>
</head>
<body>
<h1>Aurix Web SDK demo</h1>
<p>Control channel over WebSocket, microphone uplink + server-mixed downlink over WebRTC.</p>

<fieldset>
  <legend>Server</legend>
  <div class="row">
    <label>API URL <input id="api" value="http://127.0.0.1:8080"></label>
    <label>WebSocket URL <input id="ws" value="ws://127.0.0.1:8081/ws"></label>
  </div>
  <label>Player token (JWT from <code>POST /v1/tokens</code>) <input id="token" placeholder="eyJ..."></label>
  <label>Channel ID <input id="channel" placeholder="uuid"></label>
  <details>
    <summary>Development helper: issue a token with an API key (never ship an API key to browsers)</summary>
    <div class="row">
      <label>API key <input id="apikey" placeholder="aurx_..."></label>
      <label>Display name <input id="name" value="web-player"></label>
    </div>
    <button id="mkchannel">Create channel</button>
    <button id="mktoken">Issue token for channel</button>
  </details>
</fieldset>

<fieldset>
  <legend>Session <span id="state" class="status">disconnected</span></legend>
  <button id="connect">Connect</button>
  <button id="join" disabled>Join channel</button>
  <button id="leave" disabled>Leave</button>
  <button id="mute" disabled>Mute</button>
  <button id="disconnect" disabled>Disconnect</button>
  <span id="rtt"></span>
  <audio id="remote" autoplay></audio>
</fieldset>

<fieldset>
  <legend>Participants</legend>
  <ul id="roster"></ul>
</fieldset>

<fieldset>
  <legend>Text chat</legend>
  <div id="chat"></div>
  <div id="typing"></div>
  <label>Message (<code>/w &lt;user-id&gt; text</code> sends a directed message) <input id="msg" placeholder="say something" disabled></label>
</fieldset>

<fieldset>
  <legend>Log</legend>
  <div id="log"></div>
</fieldset>

<script type="module">
import { AurixClient } from '../dist/index.js';

const $ = (id) => document.getElementById(id);
const log = (...a) => { $('log').textContent += a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; $('log').scrollTop = 1e9; };

for (const id of ['api', 'ws', 'token', 'channel', 'apikey', 'name']) {
  const saved = sessionStorage.getItem('aurix.' + id);
  if (saved) $(id).value = saved;
  $(id).addEventListener('change', () => sessionStorage.setItem('aurix.' + id, $(id).value));
}

let client;
let muted = false;

function renderRoster() {
  const ul = $('roster');
  ul.innerHTML = '';
  if (!client) return;
  for (const ch of client.joinedChannels()) {
    for (const p of client.participants(ch)) {
      const li = document.createElement('li');
      li.className = (p.speaking ? 'speaking ' : '') + (p.muted || p.serverMuted ? 'muted' : '');
      li.textContent = `${p.displayName} (${p.userId.slice(0, 8)}) ${p.role !== 'unknown' ? p.role : ''}` +
        `${p.muted ? ' [muted]' : ''}${p.serverMuted ? ' [server-muted]' : ''}${p.speaking ? ' 🔊' : ''}` +
        `${client.isUserBlocked(p.userId) ? ' [blocked]' : ''}`;
      if (p.userId !== client.sessionInfo?.userId) {
        const mute = document.createElement('button');
        const locallyMuted = client.isParticipantMuted(p.userId, ch);
        mute.textContent = locallyMuted ? 'unmute for me' : 'mute for me';
        mute.onclick = () => { client.setParticipantMuted(p.userId, !locallyMuted, ch); renderRoster(); };
        const vol = document.createElement('input');
        vol.type = 'range'; vol.min = '0'; vol.max = '2'; vol.step = '0.05';
        vol.value = String(client.getParticipantVolume(p.userId));
        vol.title = 'volume for me (0..2)';
        vol.oninput = () => client.setParticipantVolume(p.userId, Number(vol.value));
        const block = document.createElement('button');
        const blocked = client.isUserBlocked(p.userId);
        block.textContent = blocked ? 'unblock' : 'block';
        block.onclick = () => client.setUserBlocked(p.userId, !blocked);
        li.append(' ', mute, ' ', vol, ' ', block);
      }
      ul.appendChild(li);
    }
  }
}

function setButtons(connected, joined) {
  $('connect').disabled = connected;
  $('join').disabled = !connected || joined;
  $('leave').disabled = !joined;
  $('mute').disabled = !connected;
  $('disconnect').disabled = !connected;
  $('msg').disabled = !joined;
}

const typingUsers = new Map();
function renderTyping() {
  const names = [...typingUsers.keys()].map((u) => {
    for (const ch of client.joinedChannels()) for (const p of client.participants(ch)) if (p.userId === u) return p.displayName;
    return u.slice(0, 8);
  });
  $('typing').textContent = names.length ? `${names.join(', ')} typing…` : '';
}

function appendChat(m, cls) {
  const div = document.createElement('div');
  div.className = cls;
  div.dataset.ref = m.clientRef ?? '';
  const when = m.sentAt.toLocaleTimeString();
  const who = m.system ? 'server' : m.displayName;
  const dm = m.toUserId ? ` → ${m.toUserId.slice(0, 8)}` : '';
  div.textContent = `[${when}] ${who}${dm}: ${m.text}${m.metadata ? ' ' + JSON.stringify(m.metadata) : ''}`;
  $('chat').appendChild(div);
  $('chat').scrollTop = 1e9;
  return div;
}

$('msg').addEventListener('input', () => {
  const ch = client?.joinedChannels()[0];
  if (ch) client.setTyping(ch, $('msg').value.length > 0);
});
$('msg').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter' || !$('msg').value.trim()) return;
  const text = $('msg').value.trim();
  $('msg').value = '';
  const ch = client.joinedChannels()[0];
  const dm = /^\/w\s+(\S+)\s+(.+)$/s.exec(text);
  const optimistic = appendChat({ displayName: 'me', text: dm ? dm[2] : text, sentAt: new Date(), toUserId: dm?.[1] }, 'own pending');
  try {
    if (dm) await client.sendDirectMessage(dm[1], dm[2]);
    else await client.sendMessage(ch, text);
    optimistic.remove();
  } catch (err) {
    optimistic.className = 'failed';
    optimistic.title = err.message;
    log('send failed:', err.message);
  }
  client.setTyping(ch, false);
});

$('connect').onclick = async () => {
  client = new AurixClient({ apiUrl: $('api').value, wsUrl: $('ws').value, token: $('token').value.trim() });
  client.on('connectionState', (s) => { $('state').textContent = s; setButtons(s !== 'disconnected' && s !== 'failed', client.joinedChannels().length > 0); });
  client.on('sessionReady', (i) => log('session', i));
  client.on('remoteStream', (s) => { $('remote').srcObject = s; log('remote stream attached'); });
  client.on('channelJoined', (ch, ps) => { log('joined', ch, `${ps.length} participants`); renderRoster(); setButtons(true, true); });
  client.on('channelLeft', (ch) => { log('left', ch); renderRoster(); setButtons(client.connectionState !== 'disconnected', false); });
  client.on('participantJoined', (ch, p) => { log('+', p.displayName); renderRoster(); });
  client.on('participantLeft', (ch, u) => { log('-', u); renderRoster(); });
  client.on('participantUpdated', renderRoster);
  client.on('receiverPreferences', (prefs) => { log('receiver prefs', prefs); renderRoster(); });
  client.on('userBlockChanged', (u, blocked) => { log(blocked ? 'blocked' : 'unblocked', u); renderRoster(); });
  client.on('recording', (ch, id, active, by) => {
    log(`recording ${active ? 'started' : 'stopped'} by ${by}`);
    if (active && confirm('This channel is being recorded. Accept?')) client.respondToRecording(id, 'accepted');
    else if (active) client.respondToRecording(id, 'declined');
  });
  client.on('bitrate', (kbps, why) => log('bitrate', kbps, why));
  client.on('kicked', (ch, why) => log('kicked from', ch, why));
  client.on('recovering', (attempt, delay, cause) => log(`connection lost (${cause}); reconnect #${attempt} in ${delay} ms`));
  client.on('recovered', (i) => log(i.resumed ? 'session resumed' : 'fresh session, channels re-joined', i.sessionId));
  client.on('failedToRecover', (e) => log('gave up reconnecting:', e.message));
  client.on('sessionClosed', (why) => log('session closed by server:', why));
  client.on('chatMessage', (m) => appendChat(m, (m.own ? 'own ' : '') + (m.system ? 'system ' : '') + (m.toUserId ? 'direct' : '')));
  client.on('participantTyping', (ch, u, typing) => {
    clearTimeout(typingUsers.get(u));
    if (typing) typingUsers.set(u, setTimeout(() => { typingUsers.delete(u); renderTyping(); }, 4000));
    else typingUsers.delete(u);
    renderTyping();
  });
  client.on('serverError', (code, msg) => log('server error', code, msg));
  client.on('error', (e) => log('error', e.message));
  try {
    await client.connect();
    setInterval(() => { if (client?.connectionState !== 'disconnected') { $('rtt').textContent = `rtt ${client.roundTripMs.toFixed(0)} ms`; client.reportQuality().catch(() => {}); } }, 5000);
  } catch (e) { log('connect failed:', e.message); }
};

$('join').onclick = async () => {
  try { await client.joinChannel($('channel').value.trim()); } catch (e) { log('join failed:', e.message); }
};
$('leave').onclick = () => client.leaveChannel($('channel').value.trim());
$('mute').onclick = () => { muted = !muted; client.setMuted(muted); $('mute').textContent = muted ? 'Unmute' : 'Mute'; };
$('disconnect').onclick = () => client.disconnect();

// ── dev helpers (server-to-server calls; only for local experiments) ──
const apiFetch = (path, body) => fetch($('api').value.replace(/\/$/, '') + path, {
  method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + $('apikey').value.trim() }, body: JSON.stringify(body),
}).then(async (r) => { if (!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json(); });

$('mkchannel').onclick = async () => {
  try { const ch = await apiFetch('/v1/channels', { name: 'web-demo-' + Date.now() }); $('channel').value = ch.id; log('channel', ch.id); }
  catch (e) { log('create channel failed:', e.message); }
};
$('mktoken').onclick = async () => {
  try {
    const t = await apiFetch('/v1/tokens', {
      external_id: 'web-' + Math.random().toString(36).slice(2, 8), display_name: $('name').value,
      channels: [{ channel_id: $('channel').value.trim(), join: true, speak: true, receive: true }],
    });
    $('token').value = t.token; log('token for user', t.user_id);
  } catch (e) { log('issue token failed:', e.message); }
};
</script>
</body>
</html>
