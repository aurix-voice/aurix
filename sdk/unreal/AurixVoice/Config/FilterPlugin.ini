[FilterPlugin]
; Additional files packaged with the plugin by `RunUAT BuildPlugin` on top of the defaults
; (*.uplugin, Config, Content, Resources, Source). Paths are relative to the plugin root and may
; use "...", "*" and "?" wildcards.
;
; The prebuilt native library lives under Source/ThirdParty/AurixClientLibrary/{include,lib} and
; is therefore already included — stage it with sdk/unreal/scripts/build_native.sh|.ps1 first.
