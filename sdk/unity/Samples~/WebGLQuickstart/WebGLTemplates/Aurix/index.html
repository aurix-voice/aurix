<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1b1f24; color: #d6dbe1; font: 14px system-ui, sans-serif; }
    #unity-container { position: absolute; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; background: {{{ BACKGROUND_COLOR }}}; }
    #unity-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
    #unity-progress { width: 240px; height: 6px; background: #2c333b; border-radius: 3px; overflow: hidden; margin: 8px auto 0; }
    #unity-progress > div { width: 0; height: 100%; background: #4f8cff; }
    #aurix-note { position: absolute; right: 12px; bottom: 8px; font-size: 12px; opacity: .6; }
    #aurix-note.error { color: #ff8080; opacity: 1; }
  </style>
  <!--
    Aurix Voice: the Web SDK bundle is loaded by the page, so the player's AurixWebGLVoiceBehaviour finds
    window.AurixWebSdk immediately and SdkUrl is ignored. Copy sdk/web/dist/aurix-web-sdk.js next to this
    file (the build copies every file of the template folder to the output) or point the tag at your CDN.
  -->
  <script src="aurix-web-sdk.js" onerror="document.getElementById('aurix-note').textContent = 'aurix-web-sdk.js is missing next to index.html'; document.getElementById('aurix-note').className = 'error';"></script>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div>Loading {{{ PRODUCT_NAME }}}…</div>
      <div id="unity-progress"><div id="unity-progress-bar"></div></div>
    </div>
    <div id="aurix-note">Aurix Voice · browser WebRTC</div>
  </div>
  <script>
    var container = document.querySelector('#unity-container');
    var canvas = document.querySelector('#unity-canvas');
    var loading = document.querySelector('#unity-loading');
    var progressBar = document.querySelector('#unity-progress-bar');
    var note = document.querySelector('#aurix-note');

    var buildUrl = 'Build';
    var loaderUrl = buildUrl + '/{{{ LOADER_FILENAME }}}';
    var config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
      workerUrl: buildUrl + '/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile browsers: fill the viewport; the voice bridge itself is the same.
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
    }

    if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      note.textContent = 'Serve this page over https:// — browsers only expose the microphone on secure origins';
      note.className = 'error';
    }

    var script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBar.style.width = 100 * progress + '%';
      }).then(function (unityInstance) {
        loading.style.display = 'none';
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        note.textContent = String(message);
        note.className = 'error';
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
