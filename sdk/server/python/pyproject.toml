[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurix-server-sdk"
version = "1.6.0"
description = "Server-side SDK for the Aurix voice platform REST API (token issuance, channels, moderation, webhooks, SSE). Generated from api/openapi.json."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["typing_extensions>=4.4; python_version < '3.11'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["aurix_server*"]

[tool.setuptools.package-data]
aurix_server = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
exclude = ["aurix_server/generated/*"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
