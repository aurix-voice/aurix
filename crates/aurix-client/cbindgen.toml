language = "C"
header = "/* Aurix native voice client — stable C ABI. Generated by cbindgen from crates/aurix-client; do not edit (run `cargo run -p aurix-client --example gen_header`). */"
include_guard = "AURIX_CLIENT_H"
pragma_once = false
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true

[export]
prefix = ""
include = ["AurixClient", "AurixEvent"]
exclude = ["SYNTH_SSRC_FLAG", "TUNNEL_UPLINK_QUEUE", "SAMPLE_RATE", "FRAME_SAMPLES", "MAX_INPUT_GAIN", "MAX_OUTPUT_VOLUME", "VERSION", "BLOCK", "MAX_ECHO_TAIL_MS", "MIN_ECHO_TAIL_MS", "MAX_STREAM_DELAY_MS", "DspConfig", "DspStats", "NoiseSuppression", "MAX_PITCH_SEMITONES", "MAX_RING_MOD_HZ", "VoiceEffect", "EffectChain", "PitchShift", "RingModulator", "CallbackEffect", "MAX_FORMANT_SEMITONES", "MAX_DISTORTION_DRIVE", "MAX_TREMOLO_HZ", "MIN_FILTER_HZ", "MAX_FILTER_HZ", "VISEME_COUNT", "Viseme", "EffectPreset", "VoiceEffectParams", "VisemeFrame", "VisemeAnalyzer", "LossProfile", "LossProfilePolicy", "LossController"]

[export.rename]
"AurixClient" = "AurixClient"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = false

[fn]
args = "auto"
sort_by = "None"

[parse]
parse_deps = false

[macro_expansion]
bitflags = false
