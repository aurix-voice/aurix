[package]
name = "aurix-soak"
description = "Aurix soak harness: native bots talking across a small fleet for hours while chaos hooks kill nodes and dependencies; asserts recovery, loss and leak budgets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aurix-soak"
path = "src/main.rs"

[dependencies]
aurix-client = { path = "../aurix-client" }
aurix-common = { path = "../aurix-common", default-features = false }
anyhow = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
