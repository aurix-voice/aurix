[package]
name = "aurix-common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["server"]
# Server-side modules (configuration, Redis/PostgreSQL glue, rate limiting, STT/TTS provider
# clients, audit chain). Client libraries disable this and get only types, protocol and crypto.
server = [
    "dep:anyhow",
    "dep:config",
    "dep:tracing",
    "dep:dashmap",
    "dep:toml",
    "dep:ipnetwork",
    "dep:redis",
    "dep:async-trait",
    "dep:tokio",
    "dep:parking_lot",
    "dep:flume",
    "dep:reqwest",
    "dep:sqlx",
    "dep:url",
    "dep:aho-corasick",
    "dep:unicode-normalization",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
config = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
bytes = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
subtle = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
rand = { workspace = true }
dashmap = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
ipnetwork = { workspace = true, optional = true }
crc32fast = { workspace = true }
redis = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
flume = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
url = { workspace = true, optional = true }
aho-corasick = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }