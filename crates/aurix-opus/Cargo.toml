[package]
name = "aurix-opus"
description = "Safe libopus 1.6 bindings for Aurix: encoder/decoder with in-band FEC, Deep REDundancy (DRED), deep PLC and OSCE speech enhancement"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# libopus is built from the bundled 1.6 sources (cmake) with the neural extensions enabled:
# the system libopus (1.3/1.4 on most distributions) has neither DRED nor OSCE.
opusic-sys = { version = "0.7.5", features = ["dred", "osce"] }
