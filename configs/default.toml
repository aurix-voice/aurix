[server]
host = "0.0.0.0"
api_port = 8080
ws_port = 8081
region = "us_east"
external_url = "http://localhost:8080"
# Public WebSocket URL of *this* node for region discovery (GET /v1/regions, /v1/me/regions,
# `endpoint` in POST /v1/tokens). Derived from external_url when unset (https -> wss, /ws);
# plain http is never advertised as ws:// in production. Point it at the node itself, not a
# shared load balancer: session resume must land on the node that holds the session.
# external_ws_url = "wss://eu1.voice.example.com/ws"
# Approximate node coordinates (WGS-84) for distance-based ordering of regions.
# location = { latitude = 50.11, longitude = 8.68 }
cors_origins = ["*"]

[database]
url = "postgres://aurix:aurix@localhost:5432/aurix"
max_connections = 100
min_connections = 5
connect_timeout_secs = 30
idle_timeout_secs = 600
run_migrations = true

[redis]
url = "redis://localhost:6379"
pool_size = 20

[auth]
jwt_secret = "change-me-in-production-this-is-not-secure-32bytes!"
jwt_algorithm = "HS256"
token_ttl_secs = 3600
# One-time action tokens (POST /v1/tokens/action): default / maximum lifetime in seconds.
action_token_ttl_secs = 90
action_token_max_ttl_secs = 600
# true: WebSocket login and ChannelJoin accept only one-time `login` / `join` action tokens.
require_action_tokens = false
oauth_enabled = false

[media]
host = "0.0.0.0"
port = 10000
max_participants_per_node = 50000
max_channels_per_node = 10000
default_bitrate = 48000
max_bitrate = 510000
default_sample_rate = 48000
enable_dtx = true
enable_fec = true
srtp_enabled = true
e2ee_enabled = false
heartbeat_interval_ms = 5000
session_timeout_secs = 60
packet_buffer_size = 4096
worker_threads = 4
# Speaking indicator: ms of silence before "not speaking", and the minimum level (0..1 linear,
# 0.01 = -40 dBov) a level-tagged frame needs to count as voice.
speaking_timeout_ms = 400
speaking_energy_threshold = 0.01
# Period of ChannelEnergy level reports to channel members (0 disables them).
energy_interval_ms = 200
# Period of per-session network-quality evaluation: the client's QualityReport merged with the
# uplink loss/jitter/bitrate the SFU measures, sent as NetworkQuality (1–5 bars) when the bars
# change and every fifth period (0 disables).
quality_interval_ms = 2000

[turn]
enabled = false
host = "0.0.0.0"
udp_port = 3478
tcp_port = 3478
realm = "aurix.local"
auth_secret = "change-me-turn-secret"
min_port = 49152
max_port = 65535
allocation_lifetime_secs = 600
max_allocations = 10000

[moderation]
enabled = false
max_reports_per_user_per_hour = 10
auto_mute_on_report_threshold = 5
profanity_filter_enabled = false

[recording]
enabled = false
storage_path = "/var/lib/aurix/recordings"
max_recording_duration_secs = 7200
retention_days = 90
encryption_enabled = false

# Real-time audio out of the node (independent of file recording; works with `enabled = false`
# above). Consent rules follow `require_consent`. Pull: an operator connects to
# `GET /v1/channels/:id/audio/streams/pull`; push: `POST /v1/channels/:id/audio/streams` makes
# the node dial an operator WebSocket. Push URLs must be wss:// and public in production
# (`require_tls` / `allow_private_urls` override).
[recording.live]
enabled = false
max_per_channel = 4
max_per_app = 64
queue_frames = 512
max_duration_secs = 0
allow_pcm = true
push_enabled = true
connect_timeout_ms = 5000
max_reconnects = 5

[metrics]
enabled = true
port = 4040
path = "/metrics"

[tracing]
enabled = true
service_name = "aurix"
log_level = "info"
log_format = "json"

[rate_limiting]
enabled = false
requests_per_second = 100
burst_size = 200
channel_joins_per_minute = 30
messages_per_second = 50

# Lightweight in-game text chat over the control WebSocket (channel + directed messages,
# typing). History is optional and off by default; the filter webhook is the moderation hook.
[chat]
enabled = true
max_message_bytes = 1024
messages_per_second = 2
message_burst = 10
typing_interval_ms = 1500
server_mute_blocks_text = true
# filter_webhook = "https://moderation.example.com/aurix/chat"
filter_timeout_ms = 1500
filter_fail_open = false
persist = false
retention_days = 30
[webhooks]
enabled = true
timeout_ms = 5000
retry_delays_secs = [5, 30, 120, 600, 1800, 3600, 7200]
poll_interval_ms = 1000
batch_size = 100
concurrency = 16
max_pending_per_subscription = 10000
retention_hours = 72
max_subscriptions_per_app = 20
# Both default to the production flag: strict in production, relaxed in development.
# require_https = true
# allow_private_urls = false
sse_keepalive_secs = 15
[retention]
enabled = true
sessions_days = 90
moderation_events_days = 365
audit_log_days = 0          # 0 = keep forever
analytics_days = 400
inactive_users_days = 0     # 0 = never auto-erase idle users
tombstones_days = 30
batch_size = 5000
interval_secs = 3600
[stt]
# Speech-to-text of channels created with `transcription = true` (OpenAI-compatible
# `/v1/audio/transcriptions`, e.g. faster-whisper-server). Transcripts are pushed to the
# channel members as `Transcript` and to webhooks/SSE as `channel.transcript`; nothing is stored.
enabled = false
# endpoint = "http://whisper:8000"
# api_key = "…"            # AURIX__STT__API_KEY
# model = "Systran/faster-whisper-small"
# language = "en"           # omit for auto-detect
segment_secs = 3.0
silence_flush_ms = 700
min_segment_ms = 400
timeout_ms = 15000
max_concurrent_requests = 8
include_words = false
[tts]
# Text-to-speech through an OpenAI-compatible `/v1/audio/speech` endpoint returning WAV
# (Piper/OpenedAI-Speech, Kokoro-FastAPI, …); the server Opus-encodes the result and plays it
# into the channel as the requester's voice (`TtsSpeak`) or as an announcement (REST).
enabled = false
# endpoint = "http://tts:8000"
# api_key = "…"            # AURIX__TTS__API_KEY
# model = "tts-1"
voices = ["alloy"]
default_voice = "alloy"
allow_client_requests = true
max_text_chars = 500
max_audio_secs = 30
timeout_ms = 15000
max_concurrent_requests = 4
max_queued_per_session = 3
max_queued_per_channel = 8
requests_per_minute_per_session = 10

[safety]
# Content safety: chat messages (and TTS text) and — for channels created with
# `safety_voice = true` — speech transcripts go through a normalized lexicon and/or an HTTP
# toxicity classifier. Hits become `safety.voice` / `safety.text` moderation events with a
# `safety.incident` webhook/SSE event; a decayed per-user risk score can trigger an automatic
# server mute or kick. Off by default; needs a classifier endpoint and/or a lexicon.
enabled = false
# Score at which a transcript/message becomes an incident (classifier score or lexicon severity).
incident_threshold = 0.7
# Restrict scoring to these classifier categories (empty = all).
categories = []
# Risk = sum of incident scores decaying with this half-life; `elevated` / `high` thresholds.
risk_half_life_secs = 900
risk_elevated = 1.0
risk_high = 2.5

[safety.classifier]
# endpoint = "http://moderation:8000/v1/moderations"
# format = "openai_moderation"   # or "aurix" ({"text","source","language","context"} → {"score","categories"})
# api_key = "…"                  # AURIX__SAFETY__CLASSIFIER__API_KEY
# model = "omni-moderation-latest"
timeout_ms = 5000
max_concurrent_requests = 8

[safety.voice]
# Requires `[stt]`; E2EE channels are never transcribed. Transcripts of `safety_voice` channels
# are analyzed only, not delivered (that is `transcription = true`).
enabled = true
# Store the flagged segment (plus `evidence_pre_segments` before it) as an encrypted Ogg/Opus
# recording of kind `evidence`, under the recording consent/storage policy (`[recording]`).
evidence = true
evidence_pre_segments = 2
evidence_retention_days = 30
# "never" | "incident" | "elevated" | "high"
auto_mute = "never"
auto_kick = "never"

[safety.text]
enabled = true
# lexicon_path = "configs/lexicon.example.toml"
# Inline rules instead of / in addition to the file:
# [[safety.text.lexicon]]
# pattern = "kys"
# action = "block"       # "mask" (default) | "block" | "flag"
# severity = 0.9
# category = "self-harm"
mask_char = "*"
# Also run the classifier on chat (with the previous `context_messages` of the conversation).
classify = true
# Messages scoring at or above this are rejected (422); below it they are delivered
# (masked by the lexicon if it matched) and recorded as an incident when over `incident_threshold`.
block_threshold = 0.9
context_messages = 5
# Deliver (lexicon-only) when the classifier is unreachable; `false` rejects the message.
fail_open = true
auto_mute = "never"
auto_kick = "never"
