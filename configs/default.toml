[server]
host = "0.0.0.0"
api_port = 8080
ws_port = 8081
region = "us_east"
external_url = "http://localhost:8080"
cors_origins = ["*"]

[database]
url = "postgres://aurix:aurix@localhost:5432/aurix"
max_connections = 100
min_connections = 5
connect_timeout_secs = 30
idle_timeout_secs = 600
run_migrations = true

[redis]
url = "redis://localhost:6379"
pool_size = 20

[auth]
jwt_secret = "change-me-in-production-this-is-not-secure-32bytes!"
jwt_algorithm = "HS256"
token_ttl_secs = 3600
# One-time action tokens (POST /v1/tokens/action): default / maximum lifetime in seconds.
action_token_ttl_secs = 90
action_token_max_ttl_secs = 600
# true: WebSocket login and ChannelJoin accept only one-time `login` / `join` action tokens.
require_action_tokens = false
oauth_enabled = false

[media]
host = "0.0.0.0"
port = 10000
max_participants_per_node = 50000
max_channels_per_node = 10000
default_bitrate = 48000
max_bitrate = 510000
default_sample_rate = 48000
enable_dtx = true
enable_fec = true
srtp_enabled = true
e2ee_enabled = false
heartbeat_interval_ms = 5000
session_timeout_secs = 60
packet_buffer_size = 4096
worker_threads = 4
# Speaking indicator: ms of silence before "not speaking", and the minimum level (0..1 linear,
# 0.01 = -40 dBov) a level-tagged frame needs to count as voice.
speaking_timeout_ms = 400
speaking_energy_threshold = 0.01
# Period of ChannelEnergy level reports to channel members (0 disables them).
energy_interval_ms = 200

[turn]
enabled = false
host = "0.0.0.0"
udp_port = 3478
tcp_port = 3478
realm = "aurix.local"
auth_secret = "change-me-turn-secret"
min_port = 49152
max_port = 65535
allocation_lifetime_secs = 600
max_allocations = 10000

[moderation]
enabled = false
max_reports_per_user_per_hour = 10
auto_mute_on_report_threshold = 5
profanity_filter_enabled = false

[recording]
enabled = false
storage_path = "/var/lib/aurix/recordings"
max_recording_duration_secs = 7200
retention_days = 90
encryption_enabled = false

# Real-time audio out of the node (independent of file recording; works with `enabled = false`
# above). Consent rules follow `require_consent`. Pull: an operator connects to
# `GET /v1/channels/:id/audio/streams/pull`; push: `POST /v1/channels/:id/audio/streams` makes
# the node dial an operator WebSocket. Push URLs must be wss:// and public in production
# (`require_tls` / `allow_private_urls` override).
[recording.live]
enabled = false
max_per_channel = 4
max_per_app = 64
queue_frames = 512
max_duration_secs = 0
allow_pcm = true
push_enabled = true
connect_timeout_ms = 5000
max_reconnects = 5

[metrics]
enabled = true
port = 4040
path = "/metrics"

[tracing]
enabled = true
service_name = "aurix"
log_level = "info"
log_format = "json"

[rate_limiting]
enabled = false
requests_per_second = 100
burst_size = 200
channel_joins_per_minute = 30
messages_per_second = 50

# Lightweight in-game text chat over the control WebSocket (channel + directed messages,
# typing). History is optional and off by default; the filter webhook is the moderation hook.
[chat]
enabled = true
max_message_bytes = 1024
messages_per_second = 2
message_burst = 10
typing_interval_ms = 1500
server_mute_blocks_text = true
# filter_webhook = "https://moderation.example.com/aurix/chat"
filter_timeout_ms = 1500
filter_fail_open = false
persist = false
retention_days = 30
[webhooks]
enabled = true
timeout_ms = 5000
retry_delays_secs = [5, 30, 120, 600, 1800, 3600, 7200]
poll_interval_ms = 1000
batch_size = 100
concurrency = 16
max_pending_per_subscription = 10000
retention_hours = 72
max_subscriptions_per_app = 20
# Both default to the production flag: strict in production, relaxed in development.
# require_https = true
# allow_private_urls = false
sse_keepalive_secs = 15
[retention]
enabled = true
sessions_days = 90
moderation_events_days = 365
audit_log_days = 0          # 0 = keep forever
analytics_days = 400
inactive_users_days = 0     # 0 = never auto-erase idle users
tombstones_days = 30
batch_size = 5000
interval_secs = 3600
[stt]
# Speech-to-text of channels created with `transcription = true` (OpenAI-compatible
# `/v1/audio/transcriptions`, e.g. faster-whisper-server). Transcripts are pushed to the
# channel members as `Transcript` and to webhooks/SSE as `channel.transcript`; nothing is stored.
enabled = false
# endpoint = "http://whisper:8000"
# api_key = "…"            # AURIX__STT__API_KEY
# model = "Systran/faster-whisper-small"
# language = "en"           # omit for auto-detect
segment_secs = 3.0
silence_flush_ms = 700
min_segment_ms = 400
timeout_ms = 15000
max_concurrent_requests = 8
include_words = false
[tts]
# Text-to-speech through an OpenAI-compatible `/v1/audio/speech` endpoint returning WAV
# (Piper/OpenedAI-Speech, Kokoro-FastAPI, …); the server Opus-encodes the result and plays it
# into the channel as the requester's voice (`TtsSpeak`) or as an announcement (REST).
enabled = false
# endpoint = "http://tts:8000"
# api_key = "…"            # AURIX__TTS__API_KEY
# model = "tts-1"
voices = ["alloy"]
default_voice = "alloy"
allow_client_requests = true
max_text_chars = 500
max_audio_secs = 30
timeout_ms = 15000
max_concurrent_requests = 4
max_queued_per_session = 3
max_queued_per_channel = 8
requests_per_minute_per_session = 10
