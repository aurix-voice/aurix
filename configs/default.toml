[server]
host = "0.0.0.0"
api_port = 8080
ws_port = 8081
region = "us_east"
external_url = "http://localhost:8080"
# Public WebSocket URL of *this* node for region discovery (GET /v1/regions, /v1/me/regions,
# `endpoint` in POST /v1/tokens). Derived from external_url when unset (https -> wss, /ws);
# plain http is never advertised as ws:// in production. Point it at the node itself, not a
# shared load balancer: session resume must land on the node that holds the session.
# external_ws_url = "wss://eu1.voice.example.com/ws"
# Approximate node coordinates (WGS-84) for distance-based ordering of regions.
# location = { latitude = 50.11, longitude = 8.68 }
cors_origins = ["*"]

[database]
url = "postgres://aurix:aurix@localhost:5432/aurix"
max_connections = 100
min_connections = 5
connect_timeout_secs = 30
idle_timeout_secs = 600
run_migrations = true

[redis]
url = "redis://localhost:6379"
pool_size = 20
# Redis Sentinel: list the sentinels and the master set name; `url` then only carries the
# password/db/TLS mode for the resolved master.
# sentinels = ["redis://sentinel-1:26379", "redis://sentinel-2:26379", "redis://sentinel-3:26379"]
# sentinel_master = "aurix"

[auth]
jwt_secret = "change-me-in-production-this-is-not-secure-32bytes!"
jwt_algorithm = "HS256"
token_ttl_secs = 3600
# One-time action tokens (POST /v1/tokens/action): default / maximum lifetime in seconds.
action_token_ttl_secs = 90
action_token_max_ttl_secs = 600
# true: WebSocket login and ChannelJoin accept only one-time `login` / `join` action tokens.
require_action_tokens = false
# false: administrators sign in through SSO only (POST /admin/login refused).
admin_password_login = true

# Admin single sign-on (OpenID Connect, authorization code + PKCE).
[auth.oidc]
enabled = false
# issuer = "https://login.example.com/realms/aurix"
# client_id = "aurix-admin"
# client_secret = ""                    # or AURIX__AUTH__OIDC__CLIENT_SECRET
# redirect_url = "https://api.example.com/admin/oidc/callback"
# frontend_redirect = "https://panel.example.com/auth/callback"
# scopes = ["openid", "email", "profile"]
# email_claim = "email"
# groups_claim = "groups"
# role_mapping = { "aurix-superadmins" = "superadmin", "aurix-admins" = "admin", "aurix-mods" = "moderator" }
# default_role = ""                     # "" refuses users without a mapped group
# superadmin_emails = ["ops@example.com"]
# allowed_domains = ["example.com"]
# require_email_verified = true
# auto_provision = true
# sync_roles = true
# state_ttl_secs = 600
# timeout_ms = 10000
# allow_insecure = false   # http issuer / private provider addresses — development and CI only

[media]
host = "0.0.0.0"
port = 10000
max_participants_per_node = 50000
max_channels_per_node = 10000
default_bitrate = 48000
max_bitrate = 510000
default_sample_rate = 48000
enable_dtx = true
enable_fec = true
srtp_enabled = true
e2ee_enabled = false
heartbeat_interval_ms = 5000
session_timeout_secs = 60
packet_buffer_size = 4096
worker_threads = 4
# Speaking indicator: ms of silence before "not speaking", and the minimum level (0..1 linear,
# 0.01 = -40 dBov) a level-tagged frame needs to count as voice.
speaking_timeout_ms = 400
speaking_energy_threshold = 0.01
# Period of ChannelEnergy level reports to channel members (0 disables them).
energy_interval_ms = 200
# Period of per-session network-quality evaluation: the client's QualityReport merged with the
# uplink loss/jitter/bitrate the SFU measures, sent as NetworkQuality (1–5 bars) when the bars
# change and every fifth period (0 disables).
quality_interval_ms = 2000
# Let native AURX sessions negotiate the G.711 μ-law (PCMU) fallback with SetAudioCodec. The
# node transcodes at the edge (channels stay Opus); each PCMU session costs one Opus encoder
# plus one decoder per speaker it hears. Disable on CPU-bound nodes.
pcmu_fallback = true
# Let native AURX sessions fall back to carrying media over their control WebSocket (TCP) when
# UDP is blocked. Same per-packet AEAD/replay protection as UDP, but TCP head-of-line blocking
# adds latency for those sessions; UDP is always tried first by the SDKs.
media_tunnel = true
# Downlink packets queued per tunneled session (≈20 ms of audio per packet per speaker heard)
# before that session's packets are dropped; a stalled TCP connection never blocks the SFU.
tunnel_queue_packets = 128
# Let native AURX sessions receive one server-mixed stereo stream per channel instead of a
# stream per speaker (`SetDownlinkMode { mode: "mixed" }`; forced on listeners of channels
# with `audience.mix_for_listeners`). Receivers without per-receiver rules share one mixer per
# channel (one decode per speaker + one encode per channel); receivers with local mutes /
# volumes / positional or ambient gains get a private mixer (one encode each).
downlink_mix = true
# libopus decoder complexity (0..=10) of the server mixers: >= 5 conceals lost uplink frames
# with the neural PLC, >= 6 adds OSCE speech enhancement. Frames are first rebuilt from the next
# packet's in-band FEC / DRED regardless; this tunes what remains. CPU per concealed frame.
mixer_decoder_complexity = 5
# Per-participant WebRTC downlink tracks a browser may negotiate on top of the mixed track
# (`SessionInitAck.webrtc_participant_streams`, at most 64). Each carries one speaker's own
# Opus frames, forwarded as-is (no transcoding), so the browser can spatialize (Web Audio HRTF)
# and mix them itself; speakers beyond the negotiated tracks stay in the mixed track. 0 = mixed only.
webrtc_participant_streams = 16

[turn]
enabled = false
host = "0.0.0.0"
udp_port = 3478
tcp_port = 3478
realm = "aurix.local"
auth_secret = "change-me-turn-secret"
min_port = 49152
max_port = 65535
allocation_lifetime_secs = 600
max_allocations = 10000

[moderation]
enabled = false
max_reports_per_user_per_hour = 10
auto_mute_on_report_threshold = 5
profanity_filter_enabled = false

[recording]
enabled = false
storage_path = "/var/lib/aurix/recordings"
max_recording_duration_secs = 7200
retention_days = 90
encryption_enabled = false

# Real-time audio out of the node (independent of file recording; works with `enabled = false`
# above). Consent rules follow `require_consent`. Pull: an operator connects to
# `GET /v1/channels/:id/audio/streams/pull`; push: `POST /v1/channels/:id/audio/streams` makes
# the node dial an operator WebSocket. Push URLs must be wss:// and public in production
# (`require_tls` / `allow_private_urls` override).
[recording.live]
enabled = false
max_per_channel = 4
max_per_app = 64
queue_frames = 512
max_duration_secs = 0
allow_pcm = true
push_enabled = true
connect_timeout_ms = 5000
max_reconnects = 5

# Post-hoc jobs on stored recordings: channel mixdowns (`POST /v1/recordings/mixdown`, Ogg/Opus
# or WAV) and transcripts (`POST /v1/recordings/:id/transcribe`, needs an `[stt]` provider). Jobs
# run on the node that accepted the request, decode on the blocking pool with `max_concurrent`
# workers, and answer 429 when more than `max_queued` are waiting.
[recording.processing]
enabled = true
max_concurrent = 2
max_queued = 64
max_sources = 64
mixdown_bitrate = 64000
stt_chunk_secs = 30
stt_sample_rate = 16000

[metrics]
enabled = true
port = 4040
path = "/metrics"

[tracing]
enabled = true
service_name = "aurix"
log_level = "info"
log_format = "json"

# Abuse limits. Buckets are keyed by client IP / API key / user and, with Redis, shared by the
# whole fleet (a client cannot multiply its quota by spreading requests over nodes). `429`
# responses carry `Retry-After`; hits show up in `aurix_rate_limit_scope_hits_total{scope,backend}`.
[rate_limiting]
enabled = false
# REST requests per client IP (sustained / burst).
requests_per_second = 100
burst_size = 200
channel_joins_per_minute = 30
# Unused (chat flood control lives in [chat]); kept for compatibility.
messages_per_second = 50
# Share buckets through Redis; node-local buckets without it.
fleet = true
# When Redis is unreachable: false = enforce node-local, true = reject with 429.
fail_closed = false
# Enforce each API key's own `rate_limit` (requests/minute, 0 = unlimited; see POST/PATCH /v1/api-keys).
per_key = true
# Control-WebSocket connections per user, block toggles per user, reports per user,
# operator login/setup attempts per IP.
connects_per_minute = 60
block_changes_per_minute = 60
reports_per_minute = 10
admin_login_per_minute = 10
# E2EE key-distribution messages relayed per user (one wrapped key per peer per rotation).
e2ee_messages_per_minute = 3000

# Lightweight in-game text chat over the control WebSocket (channel + directed messages,
# typing). History is optional and off by default; the filter webhook is the moderation hook.
[chat]
enabled = true
max_message_bytes = 1024
messages_per_second = 2
message_burst = 10
typing_interval_ms = 1500
server_mute_blocks_text = true
# filter_webhook = "https://moderation.example.com/aurix/chat"
filter_timeout_ms = 1500
filter_fail_open = false
persist = false
retention_days = 30
# Stored chat (persist = true) also gives: directed messages to users without a live session
# are queued and replayed on their next connect, history is paged by opaque cursors, and read
# markers / unread counts are kept per user and conversation.
offline_delivery = true
offline_max_messages = 200      # newest unread directed messages replayed on connect (1..=5000)
offline_max_age_hours = 0       # 0 = replay anything within retention_days
history_page_max = 200          # largest history page a client / REST caller may ask for
unread_count_cap = 1000         # unread counters saturate here
read_receipts = true            # share read markers with channel members / the direct peer
[webhooks]
enabled = true
timeout_ms = 5000
retry_delays_secs = [5, 30, 120, 600, 1800, 3600, 7200]
poll_interval_ms = 1000
batch_size = 100
concurrency = 16
max_pending_per_subscription = 10000
retention_hours = 72
max_subscriptions_per_app = 20
# Both default to the production flag: strict in production, relaxed in development.
# require_https = true
# allow_private_urls = false
sse_keepalive_secs = 15
[retention]
enabled = true
sessions_days = 90
moderation_events_days = 365
audit_log_days = 0          # 0 = keep forever
analytics_days = 400        # legacy analytics_snapshots rows; usage buckets follow [usage]
inactive_users_days = 0     # 0 = never auto-erase idle users
tombstones_days = 30
batch_size = 5000
interval_secs = 3600
[usage]
# Usage accounting behind `GET /v1/analytics*`, the exports and the per-application quotas
# (`max_concurrent_sessions`, `monthly_participant_minutes`). CCU and minutes are derived
# from session/membership intervals by one node at a time (advisory lock); media bytes,
# chat, TTS and STT counters are flushed by every node.
enabled = true
flush_interval_secs = 15        # metered counters → database (5..=300)
aggregate_interval_secs = 60    # lifecycle → 5-minute app / hourly channel buckets (30..=3600)
retention_days = 400            # application buckets
channel_retention_days = 90     # per-channel buckets (must not exceed retention_days)
quota_cache_secs = 30           # how long a node trusts a cached monthly-minutes total (0 = query per join)

[quality]
# Per-session voice-quality analytics and alerting on top of the E-model rating computed every
# `media.quality_interval_ms`. A session's MOS below `mos_alert_threshold` for
# `mos_alert_periods` consecutive periods raises `quality.alert {metric: "mos"}`; it recovers
# (`quality.recovered`) once it stays 0.2 above the threshold as long — one alert per episode,
# never one per bad sample. 3.1 is the E-model "some users dissatisfied" boundary (2 bars).
mos_alert_threshold = 3.1       # 0 disables MOS alerts (0..=4.5)
mos_alert_periods = 3           # consecutive periods (1..=60)
# Packet loss over one period (percent, client-reported downlink or SFU-measured uplink) that
# raises `quality.alert {metric: "packet_loss" | "uplink_packet_loss"}`. 0 disables.
loss_alert_percent = 20.0
# How often a node checkpoints each live session's running quality summary to
# `sessions.quality_stats` (also written on disconnect and read on cross-node takeover).
# 0 = only on disconnect; 10..=3600 otherwise.
persist_interval_secs = 60

[stt]
# Speech-to-text of channels created with `transcription = true` (OpenAI-compatible
# `/v1/audio/transcriptions`, e.g. faster-whisper-server). Transcripts are pushed to the
# channel members as `Transcript` and to webhooks/SSE as `channel.transcript`; nothing is stored.
enabled = false
# endpoint = "http://whisper:8000"
# api_key = "…"            # AURIX__STT__API_KEY
# model = "Systran/faster-whisper-small"
# language = "en"           # omit for auto-detect
segment_secs = 3.0
silence_flush_ms = 700
min_segment_ms = 400
timeout_ms = 15000
max_concurrent_requests = 8
include_words = false
[tts]
# Text-to-speech through an OpenAI-compatible `/v1/audio/speech` endpoint returning WAV
# (Piper/OpenedAI-Speech, Kokoro-FastAPI, …); the server Opus-encodes the result and plays it
# into the channel as the requester's voice (`TtsSpeak`) or as an announcement (REST).
enabled = false
# endpoint = "http://tts:8000"
# api_key = "…"            # AURIX__TTS__API_KEY
# model = "tts-1"
voices = ["alloy"]
default_voice = "alloy"
allow_client_requests = true
max_text_chars = 500
max_audio_secs = 30
timeout_ms = 15000
max_concurrent_requests = 4
max_queued_per_session = 3
max_queued_per_channel = 8
requests_per_minute_per_session = 10

[translation]
# Live translation of transcripts: each listener names the language they want
# (`SetTranslation`), the node translates every captioned segment once per requested language
# through a self-hosted machine-translation server and delivers the translated caption (with
# the original attached) only to the listeners who asked for it; optionally the translation is
# also spoken privately to them through `[tts]`. Off by default; needs `[stt]`.
enabled = false
# "libretranslate" (POST /translate; LibreTranslate, Argos servers) or "openai_chat"
# (POST /v1/chat/completions with a translation prompt; vLLM, Ollama, llama.cpp, hosted LLMs).
provider = "libretranslate"
# endpoint = "http://libretranslate:5000"
# api_key = "…"            # AURIX__TRANSLATION__API_KEY
# model = "…"              # openai_chat only
timeout_ms = 10000
# Provider requests in flight per node; further segments fall back to the original text.
max_concurrent_requests = 8
# Segments longer than this are delivered untranslated.
max_text_chars = 2000
# Target languages listeners may request (BCP-47 tags, empty = any); AURIX__TRANSLATION__LANGUAGES=de,fr
languages = []
# Distinct target languages translated per segment and channel (most-requested win).
max_languages_per_channel = 8
# Identical (source, target, text) translations remembered per node.
cache_entries = 2048
# Offer spoken translations (`SetTranslation { speech: true }`); requires `[tts]`.
speech = true
# TTS voice per target language; others use `tts.default_voice`.
# [translation.voices]
# de = "thorsten"
# fr = "siwis"

[safety]
# Content safety: chat messages (and TTS text) and — for channels created with
# `safety_voice = true` — speech transcripts go through a normalized lexicon and/or an HTTP
# toxicity classifier. Hits become `safety.voice` / `safety.text` moderation events with a
# `safety.incident` webhook/SSE event; a decayed per-user risk score can trigger an automatic
# server mute or kick. Off by default; needs a classifier endpoint and/or a lexicon.
enabled = false
# Score at which a transcript/message becomes an incident (classifier score or lexicon severity).
incident_threshold = 0.7
# Restrict scoring to these classifier categories (empty = all).
categories = []
# Risk = sum of incident scores decaying with this half-life; `elevated` / `high` thresholds.
risk_half_life_secs = 900
risk_elevated = 1.0
risk_high = 2.5

[safety.classifier]
# endpoint = "http://moderation:8000/v1/moderations"
# format = "openai_moderation"   # or "aurix" ({"text","source","language","context"} → {"score","categories"})
# api_key = "…"                  # AURIX__SAFETY__CLASSIFIER__API_KEY
# model = "omni-moderation-latest"
timeout_ms = 5000
max_concurrent_requests = 8

[safety.voice]
# Requires `[stt]`; E2EE channels are never transcribed. Transcripts of `safety_voice` channels
# are analyzed only, not delivered (that is `transcription = true`).
enabled = true
# Store the flagged segment (plus `evidence_pre_segments` before it) as an encrypted Ogg/Opus
# recording of kind `evidence`, under the recording consent/storage policy (`[recording]`).
evidence = true
evidence_pre_segments = 2
evidence_retention_days = 30
# "never" | "incident" | "elevated" | "high"
auto_mute = "never"
auto_kick = "never"

[safety.text]
enabled = true
# lexicon_path = "configs/lexicon.example.toml"
# Inline rules instead of / in addition to the file:
# [[safety.text.lexicon]]
# pattern = "kys"
# action = "block"       # "mask" (default) | "block" | "flag"
# severity = 0.9
# category = "self-harm"
mask_char = "*"
# Also run the classifier on chat (with the previous `context_messages` of the conversation).
classify = true
# Messages scoring at or above this are rejected (422); below it they are delivered
# (masked by the lexicon if it matched) and recorded as an incident when over `incident_threshold`.
block_threshold = 0.9
context_messages = 5
# Deliver (lexicon-only) when the classifier is unreachable; `false` rejects the message.
fail_open = true
auto_mute = "never"
auto_kick = "never"

[cluster]
# Mirror live sessions into Redis so a client can resume on another node (same session id and
# SSRC) when its node dies; off without Redis.
session_mirror = true
# How long a mirror outlives its node (seconds) — the takeover window after a crash.
session_mirror_ttl_secs = 180
# A node silent in the registry for this long is lost: its sessions/memberships are closed with
# reason `node_lost` and its participants leave every roster.
node_lost_after_secs = 30
# Other nodes' public `wss://` URLs listed in `SessionInitAck.failover` (0 = none).
failover_endpoints = 3
